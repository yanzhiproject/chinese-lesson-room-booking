const words=[{"word":"登机","py":"dēngjī","posZh":"动词","posEn":"verb","th":"ขึ้นเครื่องบิน","usage":"ใช้พูดถึงการเดินเข้าไปในเครื่องบินเพื่อเริ่มเดินทาง。","example":"我要登机了。","exampleTh":"ฉันกำลังจะขึ้นเครื่องแล้ว。","usageZh":"ใช้พูดถึงการเดินเข้าไปในเครื่องบินเพื่อเริ่มเดินทาง。","usageTh":"ใช้พูดถึงการเดินเข้าไปในเครื่องบินเพื่อเริ่มเดินทาง。","meaningZh":"进入飞机，开始乘坐飞机旅行。"},{"word":"手续","py":"shǒuxù","posZh":"名词","posEn":"noun","th":"ขั้นตอน / เอกสาร","usage":"指办理事情时需要完成的步骤或准备的文件。","example":"入学手续很简单。","exampleTh":"ขั้นตอนการสมัครเรียนไม่ซับซ้อน。","usageZh":"指办理事情时需要完成的步骤或准备的文件。","usageTh":"หมายถึงขั้นตอนหรือเอกสารที่ต้องจัดการเมื่อทำธุระ。","meaningZh":"办理一件事情时需要完成的步骤或文件。"},{"word":"值机员","py":"zhíjīyuán","posZh":"名词","posEn":"noun","th":"เจ้าหน้าที่เช็กอิน","usage":"在机场柜台帮助旅客办理乘机手续的工作人员。","example":"值机员正在检查护照。","exampleTh":"เจ้าหน้าที่เช็กอินกำลังตรวจหนังสือเดินทาง。","usageZh":"在机场柜台帮助旅客办理乘机手续的工作人员。","usageTh":"พนักงานที่เคาน์เตอร์สนามบินซึ่งช่วยผู้โดยสารเตรียมตัวขึ้นเครื่อง。","meaningZh":"在机场柜台帮助旅客办理登机的工作人员。"},{"word":"出示","py":"chūshì","posZh":"动词","posEn":"verb","th":"แสดง / ยื่นให้ดู","usage":"把证件或物品拿出来给别人看。","example":"请出示你的学生证。","exampleTh":"กรุณาแสดงบัตรนักเรียน。","usageZh":"把证件或物品拿出来给别人看。","usageTh":"นำเอกสารหรือสิ่งของออกมาให้ผู้อื่นตรวจดู。","meaningZh":"拿出证件或物品给别人看。"},{"word":"内蒙古","py":"Nèi Měnggǔ","posZh":"专有名词","posEn":"proper","th":"มองโกเลียใน","usage":"中国的一个自治区，位于中国北部。","example":"我想去内蒙古旅行。","exampleTh":"ฉันอยากไปเที่ยวมองโกเลียใน。","usageZh":"中国的一个自治区，位于中国北部。","usageTh":"เขตปกครองตนเองทางตอนเหนือของประเทศจีน。","meaningZh":"中国北部的一个自治区。"},{"word":"通辽","py":"Tōngliáo","posZh":"专有名词","posEn":"proper","th":"ถงเหลียว","usage":"中国内蒙古自治区的一座城市。","example":"我朋友住在通辽。","exampleTh":"เพื่อนของฉันอาศัยอยู่ที่ถงเหลียว。","usageZh":"中国内蒙古自治区的一座城市。","usageTh":"เมืองหนึ่งในเขตมองโกเลียในของประเทศจีน。","meaningZh":"内蒙古自治区的一座城市。"},{"word":"转机","py":"zhuǎnjī","posZh":"动词","posEn":"verb","th":"เปลี่ยนเครื่อง","usage":"先乘坐一架飞机到一个地方，再换乘另一架飞机。","example":"我们要在上海转机。","exampleTh":"พวกเราต้องเปลี่ยนเครื่องที่เซี่ยงไฮ้。","usageZh":"先乘坐一架飞机到一个地方，再换乘另一架飞机。","usageTh":"เดินทางด้วยเที่ยวบินหนึ่งก่อน แล้วเปลี่ยนไปขึ้นอีกเที่ยวบินหนึ่ง。","meaningZh":"换乘另一架飞机继续旅行。"},{"word":"订票","py":"dìngpiào","posZh":"动词","posEn":"verb","th":"จองตั๋ว","usage":"提前预订车票、机票或演出票。","example":"我帮妈妈订票。","exampleTh":"ฉันช่วยแม่จองตั๋ว。","usageZh":"提前预订车票、机票或演出票。","usageTh":"จองตั๋วรถ ตั๋วเครื่องบิน หรือตั๋วเข้าชมล่วงหน้า。","meaningZh":"提前预订车票、机票或演出票。"},{"word":"信用卡","py":"xìnyòngkǎ","posZh":"名词","posEn":"noun","th":"บัตรเครดิต","usage":"可以先付款、之后再向银行还款的银行卡。","example":"我用信用卡买了一本书。","exampleTh":"ฉันใช้บัตรเครดิตซื้อหนังสือหนึ่งเล่ม。","usageZh":"可以先付款、之后再向银行还款的银行卡。","usageTh":"บัตรที่ใช้ชำระเงินก่อน แล้วจ่ายคืนให้ธนาคารภายหลัง。","meaningZh":"可以先付款、之后再向银行还款的银行卡。"},{"word":"乘坐","py":"chéngzuò","posZh":"动词","posEn":"verb","th":"โดยสาร / นั่ง","usage":"坐汽车、火车、飞机等交通工具出行。","example":"我每天乘坐公交车上学。","exampleTh":"ฉันนั่งรถเมล์ไปโรงเรียนทุกวัน。","usageZh":"坐汽车、火车、飞机等交通工具出行。","usageTh":"ใช้กับการนั่งหรือโดยสารยานพาหนะเพื่อเดินทาง。","meaningZh":"坐汽车、火车、飞机等交通工具出行。"},{"word":"航班","py":"hángbān","posZh":"名词","posEn":"noun","th":"เที่ยวบิน","usage":"按时间和路线安排的飞机班次。","example":"今天的航班晚点了。","exampleTh":"เที่ยวบินวันนี้ล่าช้า。","usageZh":"按时间和路线安排的飞机班次。","usageTh":"เที่ยวบินที่มีกำหนดเวลาและเส้นทางแน่นอน。","meaningZh":"按照规定时间和路线飞行的飞机班次。"},{"word":"起飞","py":"qǐfēi","posZh":"动词","posEn":"verb","th":"เครื่องบินออกเดินทาง","usage":"飞机离开地面开始飞行。","example":"飞机马上起飞。","exampleTh":"เครื่องบินกำลังจะออกแล้ว。","usageZh":"飞机离开地面开始飞行。","usageTh":"ใช้พูดถึงตอนที่เครื่องบินเริ่มบินขึ้นจากพื้น。","meaningZh":"飞机离开地面开始飞行。"},{"word":"托运","py":"tuōyùn","posZh":"动词","posEn":"verb","th":"โหลดสัมภาระ","usage":"把行李交给航空公司，放在飞机的货舱里运输。","example":"这只箱子需要托运。","exampleTh":"กระเป๋าเดินทางใบนี้ต้องโหลดใต้เครื่อง。","usageZh":"把行李交给航空公司，放在飞机的货舱里运输。","usageTh":"ฝากกระเป๋าให้สายการบินนำไปไว้ในช่องเก็บสัมภาระ。","meaningZh":"把行李交给航空公司运输。"},{"word":"传送带","py":"chuánsòngdài","posZh":"名词","posEn":"noun","th":"สายพานลำเลียง","usage":"可以连续移 let lang=localStorage.getItem('airport-course-lang')||'th',index=0,screen='study',questions=[],q=0,score=0,answered=false,timer=null,timerInterval=null,left=10,results=[];const testable=words.filter(w=>w.pos!=='proper');function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}function pyLine(text){return [...text].map(c=>/[一-鿿]/.test(c)?(pinyinMap[c]||''):c).filter(Boolean).join(' ')}function paintLang(){document.documentElement.lang=lang==='th'?'th':'zh-CN';document.getElementById('lang').value=lang;document.querySelectorAll('[data-t]').forEach(el=>{let key=el.dataset.t;if(key==='pos')return;el.textContent=strings[lang][key]||key});if(screen==='study')renderWord()}function renderWord(){const w=words[index],t=strings[lang];const art=wordVisuals[w.word];const artEl=document.getElementById("wordIllustration");artEl.innerHTML=art?`<span>${art}</span>`:"";artEl.style.display=art?"flex":"none";artEl.parentElement.classList.toggle("has-art",!!art);document.getElementById('count').textContent=(index+1)+' / '+words.length;document.getElementById('progress').style.width=((index+1)/words.length*100)+'%';document.getElementById('word').textContent=w.word;document.getElementById('wordPy').textContent=w.py;document.getElementById('pos').textContent=t.pos[w.pos]||w.posZh;document.getElementById('meaning').textContent=lang==='th'?w.th:w.meaningZh;document.getElementById('usage').textContent=lang==='th'?w.usageTh:w.usageZh;document.getElementById('example').textContent=w.example;document.getElementById('examplePy').textContent=pyLine(w.example);document.getElementById('exampleTh').textContent=w.exampleTh;document.getElementById('prev').disabled=index===0;document.getElementById('next').textContent=index===words.length-1?t.startTest:t.next;document.getElementById('next').dataset.finish=index===words.length-1?'1':'0'}function getUsage(w){return w.usage}
function startTest(){screen='test';document.getElementById('study').classList.add('hide');document.getElementById('test').classList.remove('hide');questions=shuffle(testable).slice(0,20).map((w,i)=>({w,kind:(i%3===2&&w.example.includes(w.word))?'context':i%2?'word':'meaning'}));q=0;score=0;results=[];renderQ()}
function makeOptions(question){const others=shuffle(testable.filter(x=>x.word!==question.w.word)).slice(0,3);const showMeaning=question.kind==='word';const label=w=>showMeaning?w.th:w.word;return shuffle([{label:label(question.w),id:question.w.word,correct:true},...others.map(w=>({label:label(w),id:w.word}))])}
function renderQ(){clearInterval(timerInterval);clearTimeout(timer);answered=false;left=10;const t=strings[lang],question=questions[q],w=question.w;const title=question.kind==='word'?t.chooseWord:question.kind==='context'?t.chooseContext:t.chooseMeaning;let prompt=question.kind==='word'?`<div class="q-context">${w.word}<div class="word-py">${w.py}</div></div>`:question.kind==='context'?`<div class="q-context">${pyLine(w.example.replace(w.word,'＿＿＿'))}</div>`:`<div class="q-context">${w.th}</div>`;const options=makeOptions(question);document.getElementById('test').innerHTML=`<div class="study-head"><div><p class="q-kicker">${t.testTitle}</p><h2 class="section-title">${t.qOf} ${q+1} / 20</h2></div><span class="count">${t.seconds} <b id="sec">10</b></span></div><div class="timer"><span id="timerBar"></span></div><p class="question">${title}</p>${prompt}<div class="options">${options.map(o=>`<button class="option" data-answer="${o.id}">${o.label}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><button class="btn primary hide" id="continue">${t.nextQuestion}</button>`;document.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.answer,false)));document.getElementById('continue').addEventListener('click',nextQ);timerInterval=setInterval(()=>{left--;const s=document.getElementById('sec');if(s)s.textContent=left;const bar=document.getElementById('timerBar');if(bar)bar.style.width=Math.max(0,left/10*100)+'%';if(left<=0)answer('',true)},1000)}
function answer(id,timeout){if(answered)return;answered=true;clearInterval(timerInterval);const item=questions[q],ok=id===item.w.word;if(ok)score++;results.push(ok);document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.dataset.answer===item.w.word)b.classList.add('correct');else if(b.dataset.answer===id&&!ok)b.classList.add('wrong')});const t=strings[lang];document.getElementById('feedback').textContent=(ok?'✓ '+t.correct:timeout?t.timedOut:t.wrong)+' · '+t.answerIs+'「'+item.w.word+'」 '+item.w.py+' — '+item.w.th;document.getElementById('continue').classList.remove('hide');document.getElementById('continue').textContent=q===19?t.finish:t.nextQuestion}
function nextQ(){if(q<19){q++;renderQ()}else showResult()}function showResult(){clearInterval(timerInterval);clearTimeout(timer);screen='result';document.getElementById('progress').style.width='100%';const t=strings[lang],pct=Math.round(score/20*100),pass=pct>=60;localStorage.setItem('airport-vocab-best',String(Math.max(Number(localStorage.getItem('airport-vocab-best')||0),pct)));const id=localStorage.getItem('airport-vocab-student-id')||('AIR-'+Math.random().toString(36).slice(2,6).toUpperCase());localStorage.setItem('airport-vocab-student-id',id);document.getElementById('test').innerHTML=`<div class="result"><p class="kicker">${t.testTitle}</p><h2 class="title">${pass?t.passed:t.retry}</h2><div class="result-score">${pct}%</div><div>${t.scoreLabel}：${score} / 20</div><div class="result-id">${t.studentId}　${id}</div><p class="small-note">${pass?(lang==='th'?'คุณสามารถเข้าเรียนบทอ่านได้จากเมนู':'你可以从菜单直接进入课文学习'):t.retry}</p><div class="actions" style="justify-content:center;flex-wrap:wrap"><button class="btn" id="retry">${t.tryAgain}</button><a class="btn" href="wo-shi-zai-wangshang-ding-de-piao.html">${t.backMenu}</a><a class="btn primary" href="wo-shi-zai-wangshang-ding-de-piao-kewen.html">${t.openReading}</a></div></div>`;document.getElementById('retry').addEventListener('click',startTest)}
document.getElementById('lang').addEventListener('change',e=>{lang=e.target.value;localStorage.setItem('airport-course-lang',lang);paintLang();if(screen==='test'&&questions.length)renderQ();if(screen==='result')showResult()});document.getElementById('prev').addEventListener('click',()=>{if(index>0){index--;renderWord()}});document.getElementById('next').addEventListener('click',()=>{if(index<words.length-1){index++;renderWord()}else startTest()});document.getElementById('startTest').addEventListener('click',startTest);paintLang();renderWord();
</script></body></html>
