<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>请问您预订房间了吗？</title>
<style>
:root{--ink:#263b35;--muted:#78837d;--paper:#f5f2ed;--card:#fffefa;--green:#315e4c;--line:#e8e3d9;--scale:1.18}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;font-family:Arial,"Noto Sans SC",sans-serif;color:var(--ink);background:var(--paper)}
body{height:100dvh;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.top{height:58px;flex:0 0 58px;background:#fbfaf7;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.brand{font-weight:700}
.tools{display:flex;align-items:center;gap:12px}
.lang{border:1px solid #dcd8ce;background:#fffefa;border-radius:8px;padding:7px 9px;color:#465a4f;font:inherit}
.wrap{flex:1;min-height:0;width:min(1120px,100%);margin:0 auto;padding:22px 28px 14px;display:flex;flex-direction:column}
.title-row{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.title{font-family:"Noto Serif SC",serif;font-size:clamp(25px,3vw,36px);line-height:1.25;margin:0;font-weight:600}
.options{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.switch{font-size:13px;color:var(--muted);display:flex;gap:7px;align-items:center;white-space:nowrap}
.size-options{display:flex;align-items:center;gap:7px}
.label{font-size:12px;color:var(--muted);white-space:nowrap}
.sizes{display:flex;gap:4px;align-items:center}
.sizes button,.nav button{border:1px solid #dcd8ce;background:#fffefa;border-radius:8px;color:#465a4f;padding:7px 10px;cursor:pointer;font:inherit}
.sizes button.active{background:var(--green);border-color:var(--green);color:white}
.story{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 26px}
.story h2{flex:0 0 auto;font-family:"Noto Serif SC",serif;font-size:17px;font-weight:600;margin:0 0 12px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.dialogue{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#c9c5bb transparent;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.message{flex-shrink:0;display:flex;gap:10px;align-items:flex-start;width:88%}
.message.right{margin-left:auto;flex-direction:row-reverse}
.avatar{flex:0 0 36px;width:36px;height:36px;display:block;overflow:hidden;border-radius:5px;border:1px solid #e4e0d7;background:#f4f2ec;image-rendering:pixelated}
.pixel-art{display:block;width:100%;height:100%;image-rendering:pixelated;shape-rendering:crispEdges}
.message.right .avatar{border-color:#e9d5ae}
.bubble-wrap{min-width:0;max-width:calc(100% - 46px)}
.name{font-size:11px;color:var(--muted);margin:0 0 4px 4px}
.message.right .name{text-align:right;margin-right:4px}
.bubble{border-radius:4px 15px 15px 15px;background:#eff5f1;border:1px solid #e1ebe4;padding:10px 13px}
.message.right .bubble{border-radius:15px 4px 15px 15px;background:#fbf3e5;border-color:#f0e5d2}
.cn{font-family:"Noto Serif SC",serif;font-size:calc(19px * var(--scale));line-height:2.55}
.cn .py-unit,.cn .word{display:inline-grid;grid-template-rows:auto auto;justify-items:center;align-items:end;vertical-align:bottom;gap:.4em;line-height:1.15;white-space:nowrap;text-align:center}.cn .py-unit{margin-inline:.035em}.cn .pinyin{grid-row:1;font:calc(10px * var(--scale)) Arial,sans-serif;color:#8a6ba8;line-height:1.15;white-space:nowrap}.cn .hanzi{grid-row:2;font:inherit;line-height:1.15;white-space:nowrap}
.translate-hint{border:0;background:transparent;padding:0;margin-left:4px;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;color:#9a8a68;cursor:pointer}
.translate-hint svg{display:block;width:14px;height:14px;transition:transform .18s ease}
.message.open .translate-hint svg{transform:rotate(180deg)}
.translate-hint:hover,.translate-hint:focus-visible{color:var(--green)}
.translate-hint:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}
.message.open .translate-hint{color:var(--green)}
.translation{display:none;margin-top:7px;padding-top:7px;border-top:1px solid #d8e4dc;color:#6c6559;font-size:calc(14px * var(--scale));line-height:1.55;background:transparent}
.message.right .translation{border-color:#eadcbe}
.message.open .translation{display:block}
.word{--word-mark:#b17a39;border-bottom:1.5px dotted var(--word-mark);cursor:pointer;margin-inline:.08em;padding:.02em .035em .38em;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone;transition:border-color .15s}.word-tone-1{--word-mark:#5c8492}.word-tone-2{--word-mark:#85719a}.word:active{border-bottom-style:solid}
.scene-break{flex-shrink:0;align-self:center;font-size:11px;color:var(--muted);padding:2px 10px;border-radius:20px;background:#f2f0e9}
.nav{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.nav button{min-width:95px;padding:8px 13px}
.nav button:disabled{opacity:.4}
.nav .step{min-width:104px;background:var(--green);border-color:var(--green);color:#fff}
.progress{flex:1;height:28px;display:flex;align-items:center;touch-action:none;padding:0 10px}
.progress input{appearance:none;width:100%;height:8px;border-radius:99px;background:linear-gradient(to right,var(--green) 0%,var(--green) var(--progress,0%),#e8e3d9 var(--progress,0%),#e8e3d9 100%);cursor:pointer}
.progress input::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border:3px solid #fff;background:var(--green);border-radius:50%;box-shadow:0 1px 5px #0003}
.progress input::-moz-range-thumb{width:13px;height:13px;border:3px solid #fff;background:var(--green);border-radius:50%}
.counter{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.detail{position:fixed;z-index:3;left:50%;bottom:18px;transform:translate(-50%,140%);opacity:0;pointer-events:none;width:min(420px,calc(100vw - 24px));max-height:min(82dvh,680px);overflow-y:auto;background:#29483b;color:white;border-radius:15px;padding:15px 18px;box-shadow:0 12px 35px #1d332a40;transition:transform .2s,opacity .2s}
.detail.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.detail b{font:600 21px "Noto Serif SC",serif}
.detail small{display:block;color:#ddcdeb;margin-top:3px}
.detail p{font-size:14px;line-height:1.65;margin:5px 0 0}
.detail-section{margin-top:10px}
.detail-label{display:block;font-size:11px;letter-spacing:.04em;color:#c5d7cc}
.detail-section p{margin-top:3px}
.close{float:right;border:0;background:#ffffff20;color:white;border-radius:50%;width:27px;height:27px}
.hide-pinyin .cn{line-height:1.65}.hide-pinyin .cn .py-unit,.hide-pinyin .cn .word{grid-template-rows:auto;gap:0}.hide-pinyin .cn .pinyin{display:none}
@media(max-width:600px){
 .progress{width:15vw}.nav{gap:5px}.nav .step{min-width:58px;padding:6px;font-size:10px}.nav button{min-width:48px;padding:6px;font-size:10px}
 .top{height:52px;flex-basis:52px;padding:0 12px}
 .wrap{padding:10px 12px 9px}
 .title-row{align-items:flex-start;gap:7px;margin-bottom:8px}
 .title{font-size:22px}
 .options{gap:9px}
 .switch{font-size:12px}
 .size-options{gap:5px}
 .label{font-size:11px}
 .sizes{gap:3px}
 .sizes button{padding:6px 8px;font-size:12px}
 .story{padding:12px 10px;border-radius:12px}
 .story h2{font-size:15px;margin-bottom:8px;padding-bottom:6px}
 .dialogue{gap:6px}
 .message{width:100%;gap:6px}
 .avatar{flex-basis:29px;width:29px;height:29px;font-size:11px}
 .bubble-wrap{max-width:calc(100% - 35px)}
 .bubble{padding:8px 9px}
 .cn{font-size:calc(18px * var(--scale));line-height:2.55}
 .translation{font-size:calc(14px * var(--scale));line-height:1.5;margin-top:6px;padding-top:6px}
 .nav button{min-width:70px;padding:7px 9px;font-size:13px}
}

#tourBackdrop[hidden],#tourSpotlight[hidden],#tourCard[hidden]{display:none!important}
#tourBackdrop{position:fixed;inset:0;z-index:1000;background:transparent}
#tourSpotlight{position:fixed;z-index:1001;border:2px solid #e3c887;border-radius:12px;box-shadow:0 0 0 9999px rgba(27,39,33,.58);pointer-events:none;transition:top .22s,left .22s,width .22s,height .22s}
#tourCard{position:fixed;z-index:1002;width:min(370px,calc(100vw - 24px));max-height:min(74dvh,520px);overflow:auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px 20px 16px;box-shadow:0 16px 44px #14251e40}
.tour-top{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px}
.tour-close{border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;width:30px;height:30px;border-radius:50%;cursor:pointer}
.tour-close:hover{background:#eae7df;color:var(--ink)}
.tour-count{font-size:11px;color:var(--muted);margin:7px 0 8px}
.tour-track{height:3px;border-radius:9px;background:#e8e3d9;overflow:hidden;margin-bottom:13px}
.tour-track span{display:block;height:100%;width:0;background:var(--green);transition:width .2s}
#tourHeading{font:600 20px/1.4 "Noto Serif SC",serif;margin:0 0 7px;color:var(--ink)}
#tourBody{font-size:15px;line-height:1.65;margin:0;color:#4d5d54}
.tour-actions{display:flex;align-items:center;gap:8px;margin-top:17px}
.tour-actions button{font:inherit;border:1px solid #dcd8ce;background:#fffefa;color:#465a4f;border-radius:8px;padding:8px 12px;cursor:pointer}
.tour-actions button:focus-visible,.tour-close:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#tourSkip{margin-right:auto}
#tourPrevious:disabled{opacity:.4;cursor:default}
#tourNext{background:var(--green);border-color:var(--green);color:#fff}
@media(max-width:600px){#tourCard{padding:15px 16px 14px;border-radius:14px}#tourHeading{font-size:18px}#tourBody{font-size:14px;line-height:1.6}.tour-actions{margin-top:13px}}
@media(prefers-reduced-motion:reduce){#tourSpotlight,#tourNext,.tour-track span{transition:none!important}}
</style></head><body>
<header class="top"><div class="brand" id="brand">ห้องเรียนภาษาจีน</div><div class="tools"><select class="lang" id="lang" aria-label="ภาษาของหน้าจอ"><option value="zh">中文</option><option value="th" selected>ไทย</option></select></div></header>
<main class="wrap"><div class="title-row"><h1 class="title">请问您预订房间了吗？</h1><div class="options"><label class="switch"><input type="checkbox" id="pinyin" checked><span id="pinyinLabel">แสดงพินอิน</span></label><div class="size-options"><span class="label" id="sizeLabel">ขนาดตัวอักษร</span><div class="sizes"><button data-size="small">เล็ก</button><button data-size="medium" class="active">กลาง</button><button data-size="large">ใหญ่</button></div></div></div></div><section class="story" id="story"><h2 id="heading"></h2><ol id="dialogue" class="dialogue"></ol></section><nav class="nav"><button id="prev">ก่อนหน้า</button><button id="step" class="step" aria-label="ประโยคถัดไป">›</button><div class="progress"><input id="progress" type="range" min="0" max="1" value="0" aria-label="บทสนทนา"></div><span class="counter" id="counter"></span><button id="next">ถัดไป</button></nav></main><aside class="detail" id="detail"><button class="close" id="close" aria-label="ปิด">×</button><b id="dw"></b><small id="dp"></small><section class="detail-section"><span class="detail-label" id="posLabel"></span><p id="dpos"></p></section><section class="detail-section"><span class="detail-label" id="meaningLabel"></span><p id="dm"></p></section><section class="detail-section"><span class="detail-label" id="usageLabel"></span><p id="dt"></p></section><section class="detail-section"><span class="detail-label" id="exampleLabel"></span><p id="de"></p><p id="dthai"></p></section></aside>

ex].target?document.querySelector(tourSteps[lang][tourIndex].target):null;card.hidden=false;card.style.visibility='hidden';card.style.transform='none';if(target){const r=target.getBoundingClientRect(),pad=5;spot.hidden=false;spot.style.left=Math.max(4,r.left-pad)+'px';spot.style.top=Math.max(4,r.top-pad)+'px';spot.style.width=Math.min(innerWidth-8,r.width+pad*2)+'px';spot.style.height=Math.min(innerHeight-8,r.height+pad*2)+'px'}else{spot.hidden=true}const cr=card.getBoundingClientRect(),margin=12;if(!target){card.style.left='50%';card.style.top='50%';card.style.transform='translate(-50%,-50%)'}else{const r=target.getBoundingClientRect(),left=Math.max(margin,Math.min(r.left,innerWidth-cr.width-margin)),below=r.bottom+14+cr.height<=innerHeight-margin,top=below?r.bottom+14:Math.max(margin,r.top-cr.height-14);card.style.left=left+'px';card.style.top=top+'px'}card.style.visibility='visible'}function renderTour(){const steps=tourSteps[lang],step=steps[tourIndex],t=terms[lang],card=document.getElementById('tourCard');document.getElementById('tourLabel').textContent=t.tourTitle;document.getElementById('tourCount').textContent=(tourIndex+1)+' / '+steps.length;document.getElementById('tourProgress').style.width=((tourIndex+1)/steps.length*100)+'%';document.getElementById('tourHeading').textContent=step.title;document.getElementById('tourBody').textContent=step.body;document.getElementById('tourSkip').textContent=t.tourSkip;const previous=document.getElementById('tourPrevious');previous.textContent=t.tourPrevious;previous.disabled=tourIndex===0;document.getElementById('tourNext').textContent=tourIndex===steps.length-1?t.tourStart:t.tourNext;document.getElementById('tourClose').setAttribute('aria-label',t.tourClose);card.hidden=false;requestAnimationFrame(positionTour)}function startTour(){let seen=false;try{seen=localStorage.getItem('lesson-room-tour-seen')==='1'}catch(e){}if(seen)return;tourOpen=true;focusBeforeTour=document.activeElement;document.getElementById('tourBackdrop').hidden=false;document.querySelector('.top').inert=true;document.querySelector('.wrap').inert=true;document.getElementById('detail').inert=true;renderTour();requestAnimationFrame(()=>document.getElementById('tourNext').focus())}document.getElementById('tourNext').addEventListener('click',()=>{if(tourIndex===tourSteps[lang].length-1){finishTour();return}tourIndex++;renderTour()});document.getElementById('tourPrevious').addEventListener('click',()=>{if(tourIndex>0){tourIndex--;renderTour()}});document.getElementById('tourSkip').addEventListener('click',finishTour);document.getElementById('tourClose').addEventListener('click',finishTour);document.addEventListener('keydown',e=>{if(!tourOpen)return;if(e.key==='Escape'){e.preventDefault();finishTour();return}if(e.key==='Tab'){const buttons=[...document.querySelectorAll('#tourCard button:not([disabled])')],first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});window.addEventListener('resize',positionTour);document.getElementById('dialogue').addEventListener('scroll',positionTour,{passive:true});function wordMarkup(text){const keys=Object.keys(words).sort((a,b)=>b.length-a.length);let out='',plain='',i=0,tone=0;const flush=()=>{if(plain){out+=annotate(plain);plain=''}};while(i<text.length){const hit=keys.find(key=>text.startsWith(key,i));if(hit){flush();out+='<span class="word word-tone-'+(tone++%3)+'" data-word="'+hit+'"><span class="pinyin">'+words[hit][0]+'</span><span class="hanzi">'+hit+'</span></span>';i+=hit.length}else{plain+=text[i];i++}}flush();return out}

function dialogueMarkup(item,index){const [speaker,sentence,translation]=item.line;const student=['阿曼达','马克','永民','阿曼达和永民'].includes(speaker);const name=speaker==='阿曼达和永民'?'阿曼达 · 永民':speaker;const avatar=pixelAvatar(speaker);return `<li class="message ${student?'right':''} ${openEntry===index?'open':''}" data-entry="${index}"><div class="avatar">${avatar}</div><div class="bubble-wrap"><div class="name">${name}</div><div class="bubble"><div class="cn">${wordMarkup(sentence)}<button class="translate-hint" type="button" aria-expanded="${openEntry===index}" aria-label="${openEntry===index?terms[lang].collapse:terms[lang].expand}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 6 4.5 4.5L12.5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><div class="translation">${translation}</div></div></div></li>`}
function rowsForLesson(){const rows=[];let previous='';allEntries.forEach((item,index)=>{if(item.scene!==previous){rows.push({type:'scene',scene:item.scene});previous=item.scene}rows.push({type:'dialogue',scene:item.scene,index,item})});return rows}
function buildPages(anchorIndex){const list=document.getElementById('dialogue');const oldEntry=pages[page]?.entries?.[0]?.index;const anchor=Number.isInteger(anchorIndex)?anchorIndex:(Number.isInteger(oldEntry)?oldEntry:0);const rows=rowsForLesson();list.innerHTML=rows.map(row=>row.type==='scene'?`<li class="scene-break" data-scene="${row.scene}">${terms[lang][row.scene]}</li>`:dialogueMarkup(row.item,row.index)).join('');const nodes=[...list.children];const gap=parseFloat(getComputedStyle(list).rowGap)||0;const available=list.clientHeight;let groups=[],current=[],used=0;rows.forEach((row,i)=>{if(row.type==='scene'){const nextHeight=nodes[i+1]?.offsetHeight||0;if(!current.length)return;const sceneHeight=nodes[i].offsetHeight;if(used+gap+sceneHeight+gap+nextHeight>available){groups.push(current);current=[];used=0;return}used+=gap;current.push(row);used+=sceneHeight;return}const height=nodes[i].offsetHeight;const extra=current.length?gap:0;if(current.length&&used+extra+height>available){groups.push(current);current=[];used=0}if(current.length)used+=gap;current.push(row);used+=height});if(current.length)groups.push(current);if(!groups.length)groups=[[]];pages=groups.map(group=>{const first=group.find(row=>row.type==='dialogue');return{scene:first?.scene||'frontDesk',rows:group,entries:group.filter(row=>row.type==='dialogue')}});const target=openEntry??anchor;page=pages.findIndex(group=>group.entries.some(row=>row.index===target));if(page<0)page=0;renderPage()}
function renderPage(){const data=pages[page]||{scene:'frontDesk',rows:[],entries:[]};const pageEntries=data.entries.map(row=>row.index);if(revealed<0)revealed=pageEntries[0]??0;document.getElementById('heading').textContent=terms[lang][data.scene];document.getElementById('dialogue').innerHTML=data.rows.map(row=>row.type==='scene'?'<li class="scene-break">'+terms[lang][row.scene]+'</li>':row.index<=revealed?dialogueMarkup(row.item,row.index):'').join('');document.getElementById('counter').textContent=(page+1)+' / '+pages.length+' '+terms[lang].page;document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===pages.length-1;document.getElementById('prev').textContent=terms[lang].prev;document.getElementById('next').textContent=terms[lang].next;const step=document.getElementById('step'),nextEntry=allEntries.findIndex((item,index)=>index>revealed);step.textContent='›';step.setAttribute('aria-label',nextEntry<0?terms[lang].done:terms[lang].step);step.title=nextEntry<0?terms[lang].done:terms[lang].step;step.disabled=nextEntry<0;const progress=document.getElementById('progress');progress.max=allEntries.length-1;progress.value=revealed;progress.style.setProperty('--progress',(revealed/(allEntries.length-1)*100)+'%')}
function updateInterface(){const t=terms[lang];document.documentElement.lang=lang==='th'?'th':'zh-CN';document.getElementById('brand').textContent=t.brand;document.getElementById('posLabel').textContent=t.pos;document.getElementById('meaningLabel').textContent=t.meaning;document.getElementById('usageLabel').textContent=t.usage;document.getElementById('exampleLabel').textContent=t.example;document.getElementById('pinyinLabel').textContent=t.pinyin;document.getElementById('sizeLabel').textContent=t.size;document.getElementById('close').setAttribute('aria-label',t.close);document.querySelector('[data-size=small]').textContent=t.small;document.querySelector('[data-size=medium]').textContent=t.medium;document.querySelector('[data-size=large]').textContent=t.large}
document.getElementById('lang').addEventListener('change',e=>{lang=e.target.value;updateInterface();buildPages()});document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{scale={small:1.05,medium:1.18,large:1.34}[button.dataset.size];document.documentElement.style.setProperty('--scale',scale);document.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('active',b===button));buildPages()}));document.getElementById('pinyin').addEventListener('change',e=>{document.body.classList.toggle('hide-pinyin',!e.target.checked);buildPages()});document.getElementById('prev').addEventListener('click',()=>{if(page>0){page--;revealed=pages[page].entries.at(-1)?.index??-1;openEntry=null;playBubble();renderPage()}});document.getElementById('next').addEventListener('click',()=>{if(page<pages.length-1){page++;revealed=pages[page].entries[0]?.index??-1;openEntry=null;playBubble();renderPage()}});let audioContext;function playBubble(){try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const s=audioContext.currentTime,o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.setValueAtTime(620,s);o.frequency.exponentialRampToValueAtTime(310,s+.11);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.08,s+.014);g.gain.exponentialRampToValueAtTime(.0001,s+.16);o.connect(g);g.connect(audioContext.destination);o.start(s);o.stop(s+.17)}catch(e){}}function setProgress(index){revealed=Math.max(0,Math.min(allEntries.length-1,Number(index)));page=pages.findIndex(group=>group.entries.some(row=>row.index===revealed));if(page<0)page=0;openEntry=null;playBubble();renderPage()}function revealNext(){if(revealed>=allEntries.length-1)return;revealed++;page=pages.findIndex(group=>group.entries.some(row=>row.index===revealed));if(page<0)page=pages.length-1;playBubble();renderPage()}document.getElementById('step').addEventListener('click',revealNext);document.getElementById('progress').addEventListener('input',e=>setProgress(e.target.value));document.getElementById('dialogue').addEventListener('click',e=>{const hint=e.target.closest('.translate-hint');if(hint){const message=hint.closest('[data-entry]'),index=Number(message.dataset.entry);openEntry=openEntry===index?null:index;message.classList.toggle('open',openEntry===index);hint.setAttribute('aria-expanded',String(openEntry===index));hint.setAttribute('aria-label',openEntry===index?terms[lang].collapse:terms[lang].expand);if(openEntry===index)requestAnimationFrame(()=>message.scrollIntoView({block:'nearest',behavior:'smooth'}));return}const word=e.target.closest('[data-word]');if(word){const d=words[word.dataset.word];document.getElementById('dw').textContent=word.dataset.word;document.getElementById('dp').textContent=d[0];document.getElementById('dpos').textContent=partNames[lang][d[1]]||partNames[lang].phrase;document.getElementById('dm').textContent=d[2];document.getElementById('dt').textContent=d[3];document.getElementById('de').textContent=d[4];document.getElementById('dthai').textContent=d[5];document.getElementById('detail').classList.add('show')}});document.getElementById('story').addEventListener('click',e=>{if(e.target.closest('button,[data-word]'))return;revealNext()});document.getElementById('close').addEventListener('click',()=>document.getElementById('detail').classList.remove('show'));function dismissDetailOutside(e){const detail=document.getElementById('detail');if(detail.classList.contains('show')&&!detail.contains(e.target)&&!e.target.closest('[data-word]'))detail.classList.remove('show')}document.addEventListener('pointerdown',dismissDetailOutside,true);document.addEventListener('click',dismissDetailOutside,true);let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>buildPages(),100)});updateInterface();buildPages(0);startTour();
