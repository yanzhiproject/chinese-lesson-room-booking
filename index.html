<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>请问您预订房间了吗？</title>
<style>
:root{--ink:#263b35;--muted:#78837d;--paper:#f5f2ed;--card:#fffefa;--green:#315e4c;--line:#e8e3d9;--scale:1.18}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,"Noto Sans SC",sans-serif;color:var(--ink);background:var(--paper)}
body{height:100dvh;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.top{height:58px;flex:0 0 58px;background:#fbfaf7;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.brand{font-weight:700}
.tools{display:flex;align-items:center;gap:12px}
.lang{border:1px solid #dcd8ce;background:#fffefa;border-radius:8px;padding:7px 9px;color:#465a4f;font:inherit}
.wrap{flex:1;min-height:0;width:min(1120px,100%);margin:0 auto;padding:22px 28px 14px;display:flex;flex-direction:column}
.title-row{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.title{font-family:"Noto Serif SC",serif;font-size:clamp(25px,3vw,36px);line-height:1.25;margin:0;font-weight:600}
.options{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.switch{font-size:13px;color:var(--muted);display:flex;gap:7px;align-items:center;white-space:nowrap}
.size-options{display:flex;align-items:center;gap:7px}
.label{font-size:12px;color:var(--muted);white-space:nowrap}
.sizes{display:flex;gap:4px;align-items:center}
.sizes button,.nav button{border:1px solid #dcd8ce;background:#fffefa;border-radius:8px;color:#465a4f;padding:7px 10px;cursor:pointer;font:inherit}
.sizes button.active{background:var(--green);border-color:var(--green);color:white}
.story{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 26px}
.story h2{flex:0 0 auto;font-family:"Noto Serif SC",serif;font-size:17px;font-weight:600;margin:0 0 12px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.dialogue{flex:1;min-height:0;overflow:hidden;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.message{flex-shrink:0;display:flex;gap:10px;align-items:flex-start;width:88%}
.message.right{margin-left:auto;flex-direction:row-reverse}
.avatar{flex:0 0 36px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#edf3ee;border:1.5px solid #d6e3da;color:var(--green);font-size:13px;font-weight:600}
.message.right .avatar{background:#f8efdf;border-color:#e9d5ae;color:#8f6838}
.bubble-wrap{min-width:0;max-width:calc(100% - 46px)}
.name{font-size:11px;color:var(--muted);margin:0 0 4px 4px}
.message.right .name{text-align:right;margin-right:4px}
.bubble{border-radius:4px 15px 15px 15px;background:#eff5f1;border:1px solid #e1ebe4;padding:10px 13px}
.message.right .bubble{border-radius:15px 4px 15px 15px;background:#fbf3e5;border-color:#f0e5d2}
.cn{font-family:"Noto Serif SC",serif;font-size:calc(19px * var(--scale));line-height:1.65}
.cn ruby rt{font:calc(10px * var(--scale)) Arial,sans-serif;color:#8a6ba8}
.translate-hint{border:0;background:transparent;padding:2px 0 2px 5px;color:#9a8a68;font-size:12px;white-space:nowrap;cursor:pointer}
.translate-hint:hover,.translate-hint:focus-visible{color:var(--green);text-decoration:underline}
.message.open .translate-hint{color:var(--green)}
.translation{display:none;margin-top:7px;padding-top:7px;border-top:1px solid #d8e4dc;color:#6c6559;font-size:calc(14px * var(--scale));line-height:1.55;background:transparent}
.message.right .translation{border-color:#eadcbe}
.message.open .translation{display:block}
.word{border-bottom:1px dotted #baa56c;cursor:pointer}
.scene-break{flex-shrink:0;align-self:center;font-size:11px;color:var(--muted);padding:2px 10px;border-radius:20px;background:#f2f0e9}
.nav{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.nav button{min-width:95px;padding:8px 13px}
.nav button:disabled{opacity:.4}
.nav .step{min-width:104px;background:var(--green);border-color:var(--green);color:#fff}
.progress{width:min(230px,20vw);display:flex;align-items:center;touch-action:none}
.progress input{appearance:none;width:100%;height:8px;border-radius:99px;background:linear-gradient(to right,var(--green) 0%,var(--green) var(--progress,0%),#e8e3d9 var(--progress,0%),#e8e3d9 100%);cursor:pointer}
.progress input::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border:3px solid #fff;background:var(--green);border-radius:50%;box-shadow:0 1px 5px #0003}
.progress input::-moz-range-thumb{width:13px;height:13px;border:3px solid #fff;background:var(--green);border-radius:50%}
.counter{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.detail{position:fixed;z-index:3;left:50%;bottom:18px;transform:translate(-50%,140%);opacity:0;pointer-events:none;width:min(420px,calc(100vw - 24px));background:#29483b;color:white;border-radius:15px;padding:15px 18px;box-shadow:0 12px 35px #1d332a40;transition:transform .2s,opacity .2s}
.detail.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.detail b{font:600 21px "Noto Serif SC",serif}
.detail small{display:block;color:#ddcdeb;margin-top:3px}
.detail p{font-size:14px;line-height:1.65;margin:10px 0 0}
.close{float:right;border:0;background:#ffffff20;color:white;border-radius:50%;width:27px;height:27px}
.hide-pinyin rt{visibility:hidden}
@media(max-width:600px){
 .progress{width:15vw}.nav{gap:5px}.nav .step{min-width:58px;padding:6px;font-size:10px}.nav button{min-width:48px;padding:6px;font-size:10px}
 .top{height:52px;flex-basis:52px;padding:0 12px}
 .wrap{padding:10px 12px 9px}
 .title-row{align-items:flex-start;gap:7px;margin-bottom:8px}
 .title{font-size:22px}
 .options{gap:9px}
 .switch{font-size:12px}
 .size-options{gap:5px}
 .label{font-size:11px}
 .sizes{gap:3px}
 .sizes button{padding:6px 8px;font-size:12px}
 .story{padding:12px 10px;border-radius:12px}
 .story h2{font-size:15px;margin-bottom:8px;padding-bottom:6px}
 .dialogue{gap:6px}
 .message{width:100%;gap:6px}
 .avatar{flex-basis:29px;width:29px;height:29px;font-size:11px}
 .bubble-wrap{max-width:calc(100% - 35px)}
 .bubble{padding:8px 9px}
 .cn{font-size:calc(18px * var(--scale));line-height:1.55}
 .translation{font-size:calc(14px * var(--scale));line-height:1.5;margin-top:6px;padding-top:6px}
 .nav button{min-width:70px;padding:7px 9px;font-size:13px}
}
</style></head><body>
<header class="top"><div class="brand" id="brand">ห้องเรียนภาษาจีน</div><div class="tools"><select class="lang" id="lang" aria-label="ภาษาของหน้าจอ"><option value="zh">中文</option><option value="th" selected>ไทย</option></select></div></header>
<main class="wrap"><div class="title-row"><h1 class="title">请问您预订房间了吗？</h1><div class="options"><label class="switch"><input type="checkbox" id="pinyin" checked><span id="pinyinLabel">แสดงพินอิน</span></label><div class="size-options"><span class="label" id="sizeLabel">ขนาดตัวอักษร</span><div class="sizes"><button data-size="small">เล็ก</button><button data-size="medium" class="active">กลาง</button><button data-size="large">ใหญ่</button></div></div></div></div><section class="story" id="story"><h2 id="heading"></h2><ol id="dialogue" class="dialogue"></ol></section><nav class="nav"><button id="prev">ก่อนหน้า</button><button id="step" class="step">›</button><div class="progress"><input id="progress" type="range" min="0" max="1" value="0" aria-label="บทสนทนา"></div><span class="counter" id="counter"></span><button id="next">ถัดไป</button></nav></main><aside class="detail" id="detail"><button class="close" id="close" aria-label="ปิด">×</button><b id="dw"></b><small id="dp"></small><p id="dm"></p><p id="dt"></p><p id="de"></p></aside>

function annotate(s){const keys=[...new Set([...Object.keys(words),...Object.keys(pinyin)])].sort((a,b)=>b.length-a.length);let out='',i=0;while(i<s.length){const hit=keys.find(key=>s.startsWith(key,i));if(hit){out+=`<ruby>${hit}<rt>${words[hit]?.[0]||pinyin[hit]||''}</rt></ruby>`;i+=hit.length}else{out+=s[i];i++}}return out}

function dialogueMarkup(item,index){const [speaker,sentence,translation]=item.line;const student=['阿曼达','马克','永民','阿曼达和永民'].includes(speaker);const name=speaker==='阿曼达和永民'?'阿曼达 · 永民':speaker;const avatar=speaker==='阿曼达'?'安':speaker==='马克'?'马':speaker==='永民'?'永':speaker==='阿曼达和永民'?'安永':'服';return `<li class="message ${student?'right':''} ${openEntry===index?'open':''}" data-entry="${index}"><div class="avatar">${avatar}</div><div class="bubble-wrap"><div class="name">${name}</div><div class="bubble"><div class="cn">${wordMarkup(sentence)}<button class="translate-hint" type="button" aria-expanded="${openEntry===index}" aria-label="${terms[lang].expand}">⌄</button></div><div class="translation">${translation}</div></div></div></li>`}

function buildPages(anchorIndex){const list=document.getElementById('dialogue');const oldEntry=pages[page]?.entries?.[0]?.index;const anchor=Number.isInteger(anchorIndex)?anchorIndex:(Number.isInteger(oldEntry)?oldEntry:0);const rows=rowsForLesson();list.innerHTML=rows.map(row=>row.type==='scene'?`<li class="scene-break" data-scene="${row.scene}">${terms[lang][row.scene]}</li>`:dialogueMarkup(row.item,row.index)).join('');const nodes=[...list.children];const gap=parseFloat(getComputedStyle(list).rowGap)||0;const available=list.clientHeight;let groups=[],current=[],used=0;rows.forEach((row,i)=>{if(row.type==='scene'){const nextHeight=nodes[i+1]?.offsetHeight||0;if(!current.length)return;const sceneHeight=nodes[i].offsetHeight;if(used+gap+sceneHeight+gap+nextHeight>available){groups.push(current);current=[];used=0;return}used+=gap;current.push(row);used+=sceneHeight;return}const height=nodes[i].offsetHeight;const extra=current.length?gap:0;if(current.length&&used+extra+height>available){groups.push(current);current=[];used=0}if(current.length)used+=gap;current.push(row);used+=height});if(current.length)groups.push(current);if(!groups.length)groups=[[]];pages=groups.map(group=>{const first=group.find(row=>row.type==='dialogue');return{scene:first?.scene||'frontDesk',rows:group,entries:group.filter(row=>row.type==='dialogue')}});const target=openEntry??anchor;page=pages.findIndex(group=>group.entries.some(row=>row.index===target));if(page<0)page=0;renderPage()}
