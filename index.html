<main class="wrap"><div class="title-row"><h1 class="title">请问您预订房间了吗？</h1><div class="options"><label class="switch"><input type="checkbox" id="pinyin" checked><span id="pinyinLabel">显示拼音</span></label><div class="size-options"><span class="label" id="sizeLabel">字号</span><div class="sizes"><button data-size="small">小</button><button data-size="medium" class="active">中</button><button data-size="large">大</button></div></div></div></div><section class="story"><h2 id="heading">在前台登记</h2><ol id="dialogue" class="dialogue"></ol></section><nav class="nav"><button id="prev">上一页</button><span class="counter" id="counter">1 / 5 页</span><button id="next">下一页</button></nav></main><aside class="detail" id="detail"><button class="close" id="close">×</button><b id="dw"></b><small id="dp"></small><p id="dm"></p><p id="de"></p></aside>
<script>
const words={
'服务员':['fúwùyuán','พนักงานบริการ','在酒店里，负责接待客人、提供服务的人。','服务员，请给我看一下你们的护照。'],
'欢迎光临':['huānyíng guānglín','ยินดีต้อนรับ','欢迎客人来到某个地方。常用于商店、酒店和餐厅。','服务员：您好！欢迎光临古城宾馆。'],

const lines1=[

['马克','你好！我们想办理入住。','สวัสดีครับ พวกเราต้องการเช็กอิน','办理','入住'],
['服务员','请问，您预订房间了吗？','ขอถามหน่อยครับ คุณได้จองห้องพักไว้หรือยัง','预订','房间'],
['马克','预订了。我叫 Mark Johnson。','จองไว้แล้วครับ ผมชื่อ Mark Johnson','预订'],
['服务员','请给我看一下你们的护照。','ขอดูหนังสือเดินทางของพวกคุณหน่อยครับ','护照'],

['服务员','你们订了一个标准间和一个单人间，一共四天，对吗？','พวกคุณจองห้องมาตรฐานหนึ่งห้องและห้องเดี่ยวหนึ่งห้อง รวมทั้งหมดสี่วัน ใช่ไหมครับ','标准间','单人间','一共'],

['服务员','好的，你们的房间号是826和832。这是房卡。','ได้ครับ หมายเลขห้องของพวกคุณคือ 826 และ 832 นี่คือคีย์การ์ดห้องพัก','房卡']
];
const lines2=[
['阿曼达','请问，房间里可以上网吗？','ขอถามหน่อยค่ะ ในห้องพักใช้อินเทอร์เน็ตได้ไหม','房间','上网'],
['服务员','可以。','ได้ครับ'],

['服务员','密码就在房卡的背面。','รหัสผ่านอยู่ด้านหลังคีย์การ์ดห้องพักครับ','密码','房卡'],
['阿曼达','能不能再给我一床被子，这里很冷。','ขอผ้าห่มเพิ่มอีกผืนได้ไหมคะ ที่นี่หนาวมาก','被子'],

['阿曼达','谢谢你，再见！','ขอบคุณค่ะ แล้วพบกันใหม่！']
];
const pinyin={'您好':'nínhǎo','古城宾馆':'Gǔchéng Bīnguǎn','马克':'Mǎkè','我们':'wǒmen','想':'xiǎng','请问':'qǐngwèn','您':'nín','房间':'fángjiān','了吗':'le ma','我':'wǒ','叫':'jiào','给':'gěi','看':'kàn','一下':'yíxià','你们':'nǐmen','的':'de','和':'hé','一个':'yí ge','四天':'sì tiān','对吗':'duì ma','对':'duì','请':'qǐng','填':'tián','好':'hǎo','填完':'tiánwán','谢谢':'xièxie','手机号码':'shǒujī hàomǎ','是':'shì','不是':'bú shì','这':'zhè','号码':'hàomǎ','826':'826','832':'832','喂':'wèi','有什么':'yǒu shénme','可以':'kěyǐ','吗':'ma','但是':'dànshì','不知道':'bù zhīdào','wifi':'Wi-Fi','能不能':'néng bu néng','再':'zài','一床':'yì chuáng','很冷':'hěn lěng','洗手间':'xǐshǒujiān','对面':'duìmiàn','有':'yǒu','最上面':'zuì shàngmiàn','您可以':'nín kěyǐ','用':'yòng','你':'nǐ','再见':'zàijiàn','了':'le','入住':'rùzhù','宾馆':'bīnguǎn','标准间':'biāozhǔnjiān','单人间':'dānrénjiān','登记卡':'dēngjìkǎ','房卡':'fángkǎ'};
function annotate(s){const keys=[...new Set([...Object.keys(words),...Object.keys(pinyin)])].sort((a,b)=>b.length-a.length);let out='',i=0;while(i<s.length){const hit=keys.find(key=>s.startsWith(key,i));if(hit){out+=`<ruby>${hit}<rt>${words[hit]?.[0]||pinyin[hit]||''}</rt></ruby>`;i+=hit.length}else{out+=s[i];i++}}return out}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const pages=[
 {heading:'在前台登记',entries:lines1.slice(0,4)},
 {heading:'在前台登记',entries:lines1.slice(4,8)},
 {heading:'在前台登记',entries:lines1.slice(8,13)},
 {heading:'在房间里',entries:lines2.filter(x=>x[0]!=='STAGE').slice(0,5)},
 {heading:'在房间里',entries:lines2.filter(x=>x[0]!=='STAGE').slice(5)},
];let page=0;let lang='zh';let scale=1;
const terms={zh:{pinyin:'显示拼音',size:'字号',small:'小',medium:'中',large:'大',prev:'上一页',next:'下一页',page:'页',vocab:'本课生词',example:'例句：'},th:{pinyin:'แสดงพินอิน',size:'ขนาดตัวอักษร',small:'เล็ก',medium:'กลาง',large:'ใหญ่',prev:'ก่อนหน้า',next:'ถัดไป',page:'หน้า',vocab:'คำศัพท์บทนี้',example:'ตัวอย่าง:'}};
function wordMarkup(text){let safe=esc(text);for(const key of Object.keys(words).sort((a,b)=>b.length-a.length))safe=safe.replaceAll(key,`<span class="word" data-word="${key}">${key}</span>`);return safe.split(/(<span class="word"[^>]*>.*?<\/span>)/g).map(bit=>bit.startsWith('<span')?bit:annotate(bit)).join('')}
function render(){const data=pages[page];const list=document.getElementById('dialogue');document.getElementById('heading').textContent=data.heading;list.innerHTML=data.entries.map(([speaker,sentence,translation])=>{const student=['阿曼达','马克','永民','阿曼达和永民'].includes(speaker);const name=speaker==='阿曼达和永民'?'阿曼达 · 永民':speaker;const avatar=speaker==='阿曼达'?'安':speaker==='马克'?'马':speaker==='永民'?'永':speaker==='阿曼达和永民'?'安永':'服';return `<li class="message ${student?'right':''}"><div class="avatar">${avatar}</div><div class="bubble-wrap"><div class="name">${name}</div><div class="bubble"><div class="cn">${wordMarkup(sentence)}<button class="translate-hint" type="button" aria-expanded="false" aria-label="展开译文">⌄</button></div><div class="translation">${translation}</div></div></div></li>`}).join('');document.getElementById('counter').textContent=`${page+1} / ${pages.length} ${terms[lang].page}`;document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===pages.length-1;document.getElementById('prev').textContent=terms[lang].prev;document.getElementById('next').textContent=terms[lang].next}
document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{document.body.dataset.preview=button.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b===button))}));document.getElementById('lang').addEventListener('change',e=>{lang=e.target.value;document.getElementById('pinyinLabel').textContent=terms[lang].pinyin;document.getElementById('sizeLabel').textContent=terms[lang].size;document.querySelector('[data-size=small]').textContent=terms[lang].small;document.querySelector('[data-size=medium]').textContent=terms[lang].medium;document.querySelector('[data-size=large]').textContent=terms[lang].large;render()});document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{scale={small:.88,medium:1,large:1.18}[button.dataset.size];document.documentElement.style.setProperty('--scale',scale);document.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('active',b===button))}));document.getElementById('pinyin').addEventListener('change',e=>document.body.classList.toggle('hide-pinyin',!e.target.checked));document.getElementById('prev').addEventListener('click',()=>{if(page){page--;render()}});document.getElementById('next').addEventListener('click',()=>{if(page<pages.length-1){page++;render()}});document.addEventListener('click',e=>{const word=e.target.closest('[data-word]');if(word){const d=words[word.dataset.word];document.getElementById('dw').textContent=word.dataset.word;document.getElementById('dp').textContent=d[0];document.getElementById('dm').textContent=d[1]+' · '+d[2];document.getElementById('de').textContent=terms[lang].example+' '+d[3];document.getElementById('detail').classList.add('show');return}const message=e.target.closest('.message');if(message){message.classList.toggle('open');message.querySelector('.translate-hint').setAttribute('aria-expanded',String(message.classList.contains('open')));document.querySelectorAll('.message').forEach(x=>{i
