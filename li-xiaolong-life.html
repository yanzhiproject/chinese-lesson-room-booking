const vocab=[{"word":"加州","pinyin":"Jiāzhōu","pos":"专有名词","thai":"รัฐแคลิฟอร์เนีย","use":"ชื่อรัฐทางตะวันตกของสหรัฐอเมริกา มักใช้กับ 在、去、来自 เช่น 在加州。","useTh":"ชื่อรัฐทางตะวันตกของสหรัฐอเมริกา มักใช้กับ 在、去、来自 เช่น 在加州。","example":"我朋友住在加州。","examplePinyin":"Wǒ péngyou zhù zài Jiāzhōu.","exampleThai":"เพื่อนของฉันอาศัยอยู่ที่แคลิฟอร์เนีย","posTh":"ชื่อเฉพาะ"},{"word":"旧金山","pinyin":"Jiùjīnshān","pos":"专有名词","thai":"ซานฟรานซิสโก","use":"ชื่อเมืองในรัฐแคลิฟอร์เนีย；旧金山在加州。","useTh":"ชื่อเมืองในรัฐแคลิฟอร์เนีย","example":"我姐姐在旧金山工作。","examplePinyin":"Wǒ jiějie zài Jiùjīnshān gōngzuò.","exampleThai":"พี่สาวของฉันทำงานที่ซานฟรานซิสโก","posTh":"ชื่อเฉพาะ"},{"word":"粤剧","pinyin":"Yuèjù","pos":"名词","thai":"งิ้วกวางตุ้ง","use":"งิ้วหรือศิลปะการแสดงที่ใช้ภาษากวางตุ้ง；粤 หมายถึงกวางตุ้ง。","useTh":"งิ้วหรือศิลปะการแสดงที่ใช้ภาษากวางตุ้ง","example":"奶奶喜欢看粤剧。","examplePinyin":"Nǎinai xǐhuan kàn Yuèjù.","exampleThai":"คุณย่าชอบดูงิ้วกวางตุ้ง","posTh":"คำนาม"},{"word":"妻子","pinyin":"qīzi","pos":"名词","thai":"ภรรยา","use":"ใช้เรียกคู่สมรสฝ่ายหญิง；เป็นคำที่ค่อนข้างสุภาพหรือเป็นทางการ。","useTh":"ใช้เรียกคู่สมรสฝ่ายหญิง","example":"他和妻子一起去旅行。","examplePinyin":"Tā hé qīzi yìqǐ qù lǚxíng.","exampleThai":"เขาไปเที่ยวกับภรรยา","posTh":"คำนาม"},{"word":"第四","pinyin":"dì-sì","pos":"数词","thai":"ลำดับที่สี่","use":"常用“第 + 数字”表示顺序。","useTh":"ใช้บอกลำดับของสิ่งที่อยู่ตำแหน่งที่สี่","example":"今天是这个月的第四天。","examplePinyin":"Jīntiān shì zhège yuè de dì-sì tiān.","exampleThai":"วันนี้เป็นวันที่สี่ของเดือนนี้","posTh":"คำบอกลำดับ"},{"word":"孩子","pinyin":"háizi","pos":"名词","thai":"เด็ก / ลูก","use":"三个孩子；小孩子；孩子们。","useTh":"ใช้เรียกเด็กหรือบุตร","example":"公园里有很多孩子在玩。","examplePinyin":"Gōngyuán li yǒu hěn duō háizi zài wán.","exampleThai":"มีเด็กหลายคนกำลังเล่นอยู่ในสวน","posTh":"คำนาม"},{"word":"太极拳","pinyin":"tàijíquán","pos":"名词","thai":"ไท่จี๋ฉวน / ไทเก๊ก","use":"ศิลปะการต่อสู้จีนที่เคลื่อนไหวช้าและต่อเนื่อง มักพูดว่า 打太极拳。","useTh":"ศิลปะการต่อสู้จีนที่เคลื่อนไหวช้าและต่อเนื่อง มักพูดว่า 打太极拳。","example":"爷爷每天早上打太极拳。","examplePinyin":"Yéye měitiān zǎoshang dǎ tàijíquán.","exampleThai":"คุณปู่ฝึกไทเก๊กทุกเช้า","posTh":"คำนาม"},{"word":"咏春拳","pinyin":"yǒngchūnquán","pos":"名词","thai":"หย่งชุนฉวน / วิงชุน","use":"ศิลปะการต่อสู้จีนชนิดหนึ่ง；永春也常写作咏春。","useTh":"ศิลปะการต่อสู้จีนชนิดหนึ่ง","example":"他在武术班学习永春拳。","examplePinyin":"Tā zài wǔshù bān xuéxí Yǒngchūnquán.","exampleThai":"เขาเรียนวิงชุนในชั้นเรียนศิลปะการต่อสู้","posTh":"คำนาม"},{"word":"热爱","pinyin":"rè’ài","pos":"动词","thai":"รักและหลงใหล","use":"ความรู้สึกรักอย่างลึกซึ้ง มักใช้กับ 热爱生活、热爱音乐、热爱工作。","useTh":"ความรู้สึกรักอย่างลึกซึ้ง มักใช้กับ 热爱生活、热爱音乐、热爱工作。","example":"她热爱音乐。","examplePinyin":"Tā rè’ài yīnyuè.","exampleThai":"เธอรักดนตรีมาก","posTh":"คำกริยา"},{"word":"为了","pinyin":"wèile","pos":"介词","thai":"เพื่อ / เพื่อที่จะ","use":"บอกจุดประสงค์；后面接想达到的目标。","useTh":"บอกจุดประสงค์","example":"为了健康，我每天散步。","examplePinyin":"Wèile jiànkāng, wǒ měitiān sànbù.","exampleThai":"เพื่อสุขภาพ ฉันเดินเล่นทุกวัน","posTh":"คำบุพบท"},{"word":"提高","pinyin":"tígāo","pos":"动词","thai":"ทำให้ดีขึ้น / เพิ่มระดับ","use":"常与水平、能力、成绩、效率等搭配。","useTh":"ใช้เมื่อพูดถึงการทำให้ระดับหรือความสามารถสูงขึ้นและดีขึ้น","example":"每天练习可以提高口语水平。","examplePinyin":"Měitiān liànxí kěyǐ tígāo kǒuyǔ shuǐpíng.","exampleThai":"ฝึกทุกวันช่วยพัฒนาทักษะการพูดได้","posTh":"คำกริยา"},{"word":"功夫","pinyin":"gōngfu","pos":"名词","thai":"กังฟู；ฝีมือ","use":"“中国功夫”指武术；“下功夫”指认真努力。","useTh":"ใช้หมายถึงศิลปะการต่อสู้จีน หรือความพยายามและฝีมือ","example":"她下了很多功夫，终于学会做蛋糕。","examplePinyin":"Tā xiàle hěn duō gōngfu, zhōngyú xuéhuì zuò dàngāo.","exampleThai":"เธอตั้งใจฝึกมาก ในที่สุดก็ทำเค้กเป็น","posTh":"คำนาม"},{"word":"拳法","pinyin":"quánfǎ","pos":"名词","thai":"วิธีการชกมวย / กระบวนท่าหมัด","use":"หมายถึงหลักหรือวิธีใช้หมัดในการต่อสู้；常和 学、练、传统 搭配。","useTh":"หมายถึงหลักหรือวิธีใช้หมัดในการต่อสู้","example":"他正在练习一种新的拳法。","examplePinyin":"Tā zhèngzài liànxí yì zhǒng xīn de quánfǎ.","exampleThai":"เขากำลังฝึกวิธีชกมวยแบบใหม่","posTh":"คำนาม"},{"word":"包括","pinyin":"bāokuò","pos":"动词","thai":"รวมถึง / ประกอบด้วย","use":"ใช้บอกว่าสิ่งที่กล่าวถึงเป็นส่วนหนึ่งของทั้งหมด；后面列出具体内容。","useTh":"ใช้บอกว่าสิ่งที่กล่าวถึงเป็นส่วนหนึ่งของทั้งหมด","example":"我的行李包括衣服和书。","examplePinyin":"Wǒ de xíngli bāokuò yīfu hé shū.","exampleThai":"สัมภาระของฉันมีเสื้อผ้าและหนังสือ","posTh":"คำกริยา"},{"word":"西洋","pinyin":"Xīyáng","pos":"名词 / 形容词","thai":"ตะวันตก / โลกตะวันตก","use":"คำค่อนข้างเป็นทางการ，常见于 西洋音乐、西洋画。","useTh":"คำค่อนข้างเป็นทางการ，常见于 西洋音乐、西洋画。","example":"我想听西洋音乐。","examplePinyin":"Wǒ xiǎng tīng Xīyáng yīnyuè.","exampleThai":"ฉันอยากฟังดนตรีตะวันตก","posTh":"名词 / 形容词"},{"word":"自创","pinyin":"zìchuàng","pos":"动词","thai":"คิดค้นหรือสร้างขึ้นเอง","use":"自己创造新的方法、作品或风格；常用 自创 + 名词。","useTh":"自己创造新的方法、作品或风格","example":"这家店自创了一种新饮料。","examplePinyin":"Zhè jiā diàn zìchuàng le yì zhǒng xīn yǐnliào.","exampleThai":"ร้านนี้คิดค้นเครื่องดื่มชนิดใหม่ขึ้นเอง","posTh":"คำกริยา"},{"word":"读书","pinyin":"dúshū","pos":"动词","thai":"อ่านหนังสือ / เรียนหนังสือ","use":"ตามบริบท可指阅读，也可指在学校学习。","useTh":"ตามบริบท可指阅读，也可指在学校学习。","example":"妹妹每天晚上读书。","examplePinyin":"Mèimei měitiān wǎnshang dúshū.","exampleThai":"น้องสาวอ่านหนังสือทุกคืน","posTh":"คำกริยา"},{"word":"职业学校","pinyin":"zhíyè xuéxiào","pos":"名词","thai":"โรงเรียนอาชีวศึกษา","use":"学校里学习职业技能的地方；常和 上、毕业、学习 搭配。","useTh":"学校里学习职业技能的地方","example":"哥哥在职业学校学厨艺。","examplePinyin":"Gēge zài zhíyè xuéxiào xué chúyì.","exampleThai":"พี่ชายเรียนทำอาหารที่โรงเรียนอาชีวศึกษา","posTh":"คำนาม"},{"word":"毕业","pinyin":"bìyè","pos":"动词","thai":"เรียนจบ / สำเร็จการศึกษา","use":"完成一个阶段的学习；常说 从大学毕业、毕业以后。","useTh":"完成一个阶段的学习","example":"我去年大学毕业。","examplePinyin":"Wǒ qùnián dàxué bìyè.","exampleThai":"ฉันเรียนจบมหาวิทยาลัยเมื่อปีที่แล้ว","posTh":"คำกริยา"},{"word":"进入","pinyin":"jìnrù","pos":"动词","thai":"เข้าไป；เข้าสู่","use":"后面可接地方、学校、行业或阶段。","useTh":"ใช้บอกการเข้าไปยังสถานที่หรือการเริ่มเข้าสู่ช่วงหนึ่ง","example":"孩子们进入教室以后，老师开始上课。","examplePinyin":"Háizimen jìnrù jiàoshì yǐhòu, lǎoshī kāishǐ shàngkè.","exampleThai":"ห function render(){progress();document.body.classList.toggle('pinyin-off',!showPinyin);document.documentElement.style.setProperty('--reader-scale',fontSize==='small'?.92:fontSize==='large'?1.22:1);stage.innerHTML=screen==='cover'?cover():screen==='test'?test():screen==='lesson'?lesson():screen==='analysis'?analysisPage():fullPage();bindStage();if(screen==='test')startQuizTimer();else clearQuizTimer()}
function cover(){return `<section class="stage-content"><p class="eyebrow">${t('coverKicker')}</p><h1 class="h1">${t('startTitle')}</h1><p class="lead">${t('lead')}</p><div class="cover-art"><div class="cover-stat"><b>${vocab.length}</b><span>${t('words')}</span></div><div class="cover-stat"><b>05</b><span>${t('paragraphs')}</span></div></div><div class="actions"><button class="primary" data-action="start">${t('start')}</button></div></section>`}
function test(){if(testIndex>=firstQuiz.length){const rate=Math.round(testScore/firstQuiz.length*100),low=rate<60;return `<section class="stage-content"><div class="score-card"><p class="eyebrow">${t('testDone')}</p><div class="score-number">${rate}%</div><p>${t('scoreRate')} · ${testScore} / ${firstQuiz.length}</p><p>${t(low?'lowScore':'testPassed')}</p><div class="actions" style="justify-content:center">${low?`<button class="primary" data-action="retry-test">${t('retryQuiz')}</button>`:''}<button class="${low?'secondary':'primary'}" data-action="go-lesson">${t('continueLearning')}</button></div></div></section>`}const q=firstQuiz[testIndex],attempted=testAttempts[testIndex],resolved=testLockedByQuestion[testIndex];return `<section class="stage-content"><div class="quiz-panel"><div class="quiz-kicker">${t('quizTitle')} · ${testIndex+1}/${firstQuiz.length}</div><h1 class="quiz-word">${q.reverse?q.thai:q.word}</h1><div class="quiz-py">${!q.reverse&&showPinyin?q.pinyin:''}</div><div class="quiz-timer ${testTimeLeft<=3?'warning':''}"><span>${t('timeRemaining')} <b id="testTimer">${testTimeLeft}</b> ${t('seconds')}</span><span class="timer-track"><i id="testTimerFill" style="width:${testTimeLeft*10}%"></i></span></div><p class="quiz-prompt">${q.reverse?t('questionReverse'):t('question')}</p><div class="choices">${q.options.map((o,i)=>`<button class="choice ${resolved&&i===q.answer?'correct':''} ${testAnswers[testIndex]===i&&i!==q.answer?'wrong':''}" data-choice="${i}" ${(resolved||(attempted>0&&testAnswers[testIndex]===i))?'disabled':''}>${o}</button>`).join('')}</div><div class="feedback ${(attempted||testTimedOut[testIndex])?'show':''}" id="testFeedback">${testTimedOut[testIndex]?`<b>${t('timeUp')}</b><span>${q.correct} · ${t('timeoutHint')}</span>`:attempted?resolved?`<b>${testAnswers[testIndex]===q.answer?t('right'):t('tryAgain')}</b><span>${q.correct}</span>`:`<b>${t('retry')}</b><span>${lang==='th'?'ลองเลือกอีกครั้ง':'请再选一次'}</span>`:''}</div><div class="quiz-controls"><span class="quiz-count">${testIndex+1} / ${firstQuiz.length}</span><button class="primary" data-action="test-next" ${!resolved?'disabled':''}>${t('continue')}</button></div></div></section>`}
function toolbar(){return `<div class="reading-tools"><label><input type="checkbox" data-action="pinyin" ${showPinyin?'checked':''}><span>${t('pinyin')}</span></label><div class="sizes">${['small','medium','large'].map(x=>`<button data-size="${x}" class="${fontSize===x?'active':''}">${t(x)}</button>`).join('')}</div></div>`}
function para(p,i){return `<article class="para"><div class="para-label">${t('para')} ${i+1}</div><div class="cn-text">${p.html}</div><div class="translation">${p.th}</div></article>`}
function lesson(){return `<section class="stage-content"><p class="eyebrow">${t('lessonKicker')}</p><h1 class="section-title">${t('lessonTitle')}</h1><p class="section-sub">${t('lessonSub')}</p>${toolbar()}<div class="article">${paragraphs.map(para).join('')}</div><p class="reading-note">${t('learned')}：${visited.size} / ${vocab.length}</p><div class="stage-actions"><button class="secondary" data-action="restart">${t('prev')}</button><button class="primary" data-action="go-analysis">${t('finishRead')}</button></div></section>`}
function analysisPage(){if(analysisIndex>=analysis.length)return `<section class="stage-content"><div class="score-card"><p class="eyebrow">${t('analysisKicker')}</p><h1 class="section-title">${lang==='th'?'อ่านจบแล้ว':'课文学习完成'}</h1><p>${lang==='th'?'ทบทวนลำดับเหตุการณ์และใจความสำคัญเรียบร้อยแล้ว':'你已经完成课文理解练习，可以进入全文回顾。'}</p><button class="primary" data-action="go-full">${t('finishAnalysis')}</button></div></section>`;const q=analysis[analysisIndex];return `<section class="stage-content"><div class="explain-intro"><p class="eyebrow">${t('analysisKicker')} · ${analysisIndex+1}/${analysis.length}</p><h1 class="section-title">${t('analysisTitle')}</h1><p class="section-sub">${t('analysisSub')}</p></div><div class="quiz-panel"><h2 class="quiz-prompt" style="font:600 clamp(24px,5vw,34px)/1.5 var(--serif);margin:0 0 16px">${lang==='th'?q.th:q.q}</h2><div class="analysis-options">${q.options.map((o,i)=>`<button class="analysis-option" data-analysis-choice="${i}" ${analysisLocked?'disabled':''}>${lang==='th'?q.optionsTh[i]:o}</button>`).join('')}</div><div class="analysis-answer ${analysisLocked?'show':''}">${analysisLocked?analysisFeedback(q):''}</div><div class="quiz-controls"><span class="quiz-count">${analysisIndex+1} / ${analysis.length}</span><button class="primary" data-action="analysis-next" ${!analysisLocked?'disabled':''}>${t('continue')}</button></div></div></section>`}
function analysisFeedback(q){const choice=analysisSelections[analysisIndex],answer=lang==='th'?q.optionsTh[q.answer]:q.options[q.answer];return `${choice===q.answer?t('analysisCorrect'):t('analysisMiss').replace('{answer}',answer)}<br>${lang==='th'?q.explainTh:q.explain}`}
function fullPage(){return `<section class="stage-content"><p class="eyebrow">${t('fullKicker')}</p><h1 class="section-title">${t('fullTitle')}</h1><p class="section-sub">${t('fullSub')}</p>${toolbar()}<div class="full-text">${paragraphs.map((p,i)=>`<div class="cn-text">${p.html}</div><div class="translation">${p.th}</div>`).join('')}</div><div class="actions"><button class="secondary" data-action="restart">${t('restart')}</button></div></section>`}
function beginQuiz(){clearQuizTimer();firstQuiz=createQuiz();testIndex=0;testScore=0;testLocked=false;testAnswers=Array(firstQuiz.length).fill(-1);testAttempts=Array(firstQuiz.length).fill(0);testLockedByQuestion=Array(firstQuiz.length).fill(false);testTimedOut=Array(firstQuiz.length).fill(false);goto('test')}
function bindStage(){stage.querySelectorAll('[data-action="start"],[data-action="retry-test"]').forEach(b=>b.onclick=beginQuiz);stage.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answerTest(+b.dataset.choice));stage.querySelectorAll('[data-action="test-next"]').forEach(b=>b.onclick=()=>{if(testLockedByQuestion[testIndex]){testIndex++;testLocked=false;render()}});stage.querySelectorAll('[data-action="go-lesson"]').forEach(b=>b.onclick=()=>goto('lesson'));stage.querySelectorAll('[data-action="go-analysis"]').forEach(b=>b.onclick=()=>{analysisIndex=0;analysisLocked=false;analysisSelections.fill(-1);goto('analysis')});stage.querySelectorAll('[data-action="analysis-next"]').forEach(b=>b.onclick=()=>{if(analysisLocked){analysisIndex++;analysisLocked=false;render()}});stage.querySelectorAll('[data-action="go-full"]').forEach(b=>b.onclick=()=>goto('full'));stage.querySelectorAll('[data-action="restart"]').forEach(b=>b.onclick=()=>goto('cover'));stage.querySelectorAll('[data-action="pinyin"]').forEach(b=>b.onchange=()=>{showPinyin=b.checked;render()});stage.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{fontSize=b.dataset.size;render()});stage.querySelectorAll('.word').forEach(b=>b.onclick=()=>openWord(b.dataset.word))}
function clearQuizTimer(){if(quizTimer!==null){clearInterval(quizTimer);quizTimer=null}timerQuestionIndex=-1}function paintQuizTimer(){const n=document.querySelector('#testTimer'),bar=document.querySelector('#testTimerFill'),wrap=n&&n.closest('.quiz-timer');if(n)n.textContent=testTimeLeft;if(bar)bar.style.width=(testTimeLeft*10)+'%';if(wrap)wrap.classList.toggle('warning',testTimeLeft<=3)}function startQuizTimer(){if(screen!=='test'||testIndex>=firstQuiz.length||testLockedByQuestion[testIndex]){clearQuizTimer();return}if(quizTimer!==null&&timerQuestionIndex===testIndex){paintQuizTimer();return}clearQuizTimer();timerQuestionIndex=testIndex;testTimeLeft=10;paintQuizTimer();quizTimer=setInterval(()=>{if(screen!=='test'||testIndex!==timerQuestionIndex||testLockedByQuestion[testIndex]){clearQuizTimer();return}testTimeLeft--;paintQuizTimer();if(testTimeLeft<=0)timeOutQuestion()},1000)}function timeOutQuestion(){if(testIndex>=firstQuiz.length||testLockedByQuestion[testIndex])return;clearQuizTimer();testTimedOut[testIndex]=true;testLockedByQuestion[testIndex]=true;const q=firstQuiz[testIndex],f=document.querySelector('#testFeedback');f.innerHTML=`<b>${t('timeUp')}</b><span>${q.correct} · ${t('timeoutHint')}</span>`;f.classList.add('show');stage.querySelectorAll('[data-choice]').forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('correct')});const next=stage.querySelector('[data-action="test-next"]');if(next)next.disabled=false}
function answerTest(i){if(testLockedByQuestion[testIndex])return;const q=firstQuiz[testIndex];testAttempts[testIndex]++;testAnswers[testIndex]=i;const correct=i===q.answer,final=correct||testAttempts[testIndex]>=2;if(correct)testScore++;if(final){testLockedByQuestion[testIndex]=true;clearQuizTimer()}const f=document.querySelector('#testFeedback');f.innerHTML=correct?`<b>${t('right')}</b><span>${q.correct}</span>`:final?`<b>${t('tryAgain')}</b><span>${q.correct}</span>`:`<b>${t('retry')}</b><span>${lang==='th'?'ลองเลือกอีกครั้ง':'请再选一次'}</span>`;f.classList.add('show');stage.querySelectorAll('[data-choice]').forEach((b,j)=>{if(j===i)b.classList.add(correct?'correct':'wrong');if(correct||final)b.disabled=true;else if(j===i)b.disabled=true});stage.querySelector('[data-action="test-next"]').disabled=!final}
function answerAnalysis(i){if(analysisLocked)return;const q=analysis[analysisIndex];analysisLocked=true;analysisSelections[analysisIndex]=i;stage.querySelectorAll('[data-analysis-choice]').forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});stage.querySelector('.analysis-answer').innerHTML=analysisFeedback(q);stage.querySelector('.analysis-answer').classList.add('show');stage.querySelector('[data-action="analysis-next"]').disabled=false}
function openWord(term){const d=vocab.find(x=>x.word===term);if(!d)return;modalState={word:term,answer:null};renderWordQuiz(d);document.querySelector('#modalBackdrop').classList.add('show');document.body.style.overflow='hidden'}
function renderWordQuiz(d){if(modalState)modalState.mode='quiz';const wrong=vocab.filter(x=>x.word!==d.word).map(x=>x.thai);const options=[d.thai,...wrong].sort(()=>Math.random()-.5).slice(0,4);if(!options.includes(d.thai))options[0]=d.thai;modalState.options=options;document.querySelector('#modalBody').innerHTML=`<p class="eyebrow">${t('quizTitle')}</p><h2 class="modal-title" id="modalTitle">${t('quizPrompt').replace('{word}',d.word)}</h2><div class="modal-py">${showPinyin?d.pinyin:''}</div><div class="choices" style="margin-top:18px">${options.map((x,i)=>`<button class="choice" data-word-choice="${i}">${x}</button>`).join('')}</div><div class="feedback" id="wordFeedback"></div><div class="modal-actions"><button class="primary" id="wordContinue" disabled>${t('seeExplanation')}</button></div>`;document.querySelectorAll('[data-word-choice]').forEach(b=>b.onclick=()=>{if(modalState.answer!==null)return;const i=+b.dataset.wordChoice;modalState.answer=i;const good=options[i]===d.thai;document.querySelectorAll('[data-word-choice]').forEach((x,j)=>{x.disabled=true;if(options[j]===d.thai)x.classList.add('correct');else if(j===i&&!good)x.classList.add('wrong')});document.querySelector('#wordFeedback').innerHTML=`<b>${good?t('right'):t('tryAgain')}</b><span>${d.thai}</span>`;document.querySelector('#wordFeedback').classList.add('show');document.querySelector('#wordContinue').disabled=false});document.querySelector('#wordContinue').onclick=()=>renderWordDetail(d)}
function renderWordDetail(d){if(modalState)modalState.mode='detail';visited.add(d.word);document.querySelector('#modalBody').innerHTML=`<p class="eyebrow">${t('detailTitle')}</p><h2 class="modal-title" id="modalTitle">${d.word}</h2><div class="modal-py">${showPinyin?d.pinyin:''}</div><div class="modal-pos">${t('pos')} · ${lang==='th'?d.posTh:d.pos}</div><div class="modal-meaning">${d.thai}</div><div class="modal-copy"><b>${t('usage')}：</b>${lang==='th'?d.useTh:d.use}</div><div class="modal-example"><span>${t('example')}</span><b>${d.example}</b><span>${d.examplePinyin||d.pinyin}</span><p>${d.exampleThai}</p></div><div class="modal-actions"><button class="primary" id="detailDone">${t('next')}</button></div>`;document.querySelector('#detailDone').onclick=closeModal}
function closeModal(){const el=document.querySelector('#modalBackdrop');if(el)el.classList.remove('show');document.body.style.overflow=''}
document.querySelector('#modalClose').onclick=closeModal;document.querySelector('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.querySelector('#lang').addEventListener('change',e=>{lang=e.target.value;document.querySelector('#brandText').textContent=t('brand');render();if(modalState&&document.querySelector('#modalBackdrop').classList.contains('show')){const d=vocab.find(x=>x.word===modalState.word);if(d){if(modalState.mode==='detail')renderWordDetail(d);else renderWordQuiz(d)}}});stage.addEventListener('click',e=>{const b=e.target.closest('[data-analysis-choice]');if(b)answerAnalysis(+b.dataset.analysisChoice)});render();

</script>
