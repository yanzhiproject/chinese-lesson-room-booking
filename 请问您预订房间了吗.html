<style>

<main class="wrap"><div class="title-row"><h1 class="title" lang="zh-Hans">请问您预订房间了吗？</h1><div class="options"><label class="switch"><span id="pinyinLabel">แสดงพินอิน</span><input type="checkbox" id="pinyin" checked></label><div class="size-options"><span class="label" id="sizeLabel">ขนาดตัวอักษร</span><div class="sizes"><button data-size="small">เล็ก</button><button data-size="medium" class="active">กลาง</button><button data-size="large">ใหญ่</button></div></div></div></div><section class="story" id="story"><h2 id="heading"></h2><ol id="dialogue" class="dialogue"></ol></section><nav class="nav"><button id="prev">ก่อนหน้า</button><button id="step" class="step" aria-label="ประโยคถัดไป">ประโยคถัดไป</button><div class="progress"><input id="progress" type="range" min="0" max="1" value="0" aria-label="บทสนทนา"></div><span class="counter" id="counter"></span><button id="next">ถัดไป</button></nav></main>

function buildPages(anchorIndex){const list=document.getElementById('dialogue');const oldEntry=pages[page]?.entries?.[0]?.index;const anchor=Number.isInteger(anchorIndex)?anchorIndex:(Number.isInteger(oldEntry)?oldEntry:0);const rows=rowsForLesson();list.innerHTML=rows.map(row=>row.type==='scene'?`<li class="scene-break" data-scene="${row.scene}">${terms[lang][row.scene]}</li>`:dialogueMarkup(row.item,row.index)).join('');const nodes=[...list.children];const gap=parseFloat(getComputedStyle(list).rowGap)||0;const available=list.clientHeight;let groups=[],current=[],used=0;rows.forEach((row,i)=>{if(row.type==='scene'){const nextHeight=nodes[i+1]?.offsetHeight||0;if(!current.length)return;const sceneHeight=nodes[i].offsetHeight;if(used+gap+sceneHeight+gap+nextHeight>available){groups.push(current);current=[];used=0;return}used+=gap;current.push(row);used+=sceneHeight;return}const height=nodes[i].offsetHeight;const extra=current.length?gap:0;if(current.length&&used+extra+height>available){groups.push(current);current=[];used=0}if(current.length)used+=gap;current.push(row);used+=height});if(current.length)groups.push(current);if(!groups.length)groups=[[]];pages=groups.map(group=>{const first=group.find(row=>row.type==='dialogue');return{scene:first?.scene||'frontDesk',rows:group,entries:group.filter(row=>row.type==='dialogue')}});const target=openEntry??anchor;page=pages.findIndex(group=>group.entries.some(row=>row.index===target));if(page<0)page=0;renderPage()}

document.getElementById('lang').addEventListener('change',e=>{lang=e.target.value;updateInterface();buildPages()});document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{scale={small:1.05,medium:1.18,large:1.34}[button.dataset.size];document.documentElement.style.setProperty('--scale',scale);document.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('active',b===button));buildPages()}));document.getElementById('pinyin').addEventListener('change',e=>{document.body.classList.toggle('hide-pinyin',!e.target.checked);buildPages()});document.getElementById('prev').addEventListener('click',()=>{if(page>0){page--;revealed=pages[page].entries.at(-1)?.index??-1;openEntry=null;playBubble();renderPage()}});document.getElementById('next').addEventListener('click',()=>{if(page<pages.length-1){page++;revealed=pages[page].entries[0]?.index??-1;openEntry=null;playBubble();renderPage()}});let audioContext;function playBubble(){try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const s=audioContext.currentTime,o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.setValueAtTime(620,s);o.frequency.exponentialRampToValueAtTime(310,s+.11);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.08,s+.014);g.gain.exponentialRampToValueAtTime(.0001,s+.16);o.connect(g);g.connect(audioContext.destination);o.start(s);o.stop(s+.17)}catch(e){}}function setProgress(index){revealed=Math.max(0,Math.min(allEntries.length-1,Number(index)));page=pages.findIndex(group=>group.entries.some(row=>row.index===revealed));if(page<0)page=0;openEntry=null;playBubble();renderPage()}function revealNext(){if(revealed>=allEntries.length-1)return;revealed++;page=pages.findIndex(group=>group.entries.some(row=>row.index===revealed));if(page<0)page=pages.length-1;playBubble();renderPage()}document.getElementById('step').addEventListener('click',
