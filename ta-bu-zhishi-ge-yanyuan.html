const lines1=[["阿曼达","这儿真安静。历史课的作业，你想好写什么了吗？","ที่นี่เงียบจัง การบ้านวิชาประวัติศาสตร์ คุณคิดหรือยังว่าจะเขียนเรื่องอะไร","这儿","安静","历史","作业"],["永民","看着作业题，是怎么说的：“选择中国历史上的一位英雄，介绍他/她的生平，并解释一下你为什么认为他/她是英雄。”","ดูโจทย์การบ้านสิ เขียนว่า “เลือกวีรบุรุษคนหนึ่งในประวัติศาสตร์จีน มาเล่าประวัติชีวิตของเขาหรือเธอ แล้วอธิบายว่าทำไมคุณถึงคิดว่าเขาหรือเธอเป็นวีรบุรุษ”","作业","选择","历史","英雄","介绍","生平","解释","认为"],["阿曼达","可是什么样的人才算是英雄呢？","แต่ว่าคนแบบไหนถึงจะนับว่าเป็นวีรบุรุษล่ะ","可是","什么样","算","英雄"],["永民","英雄，不就是重要人物吗？","วีรบุรุษก็คือบุคคลสำคัญไม่ใช่เหรอ","英雄","重要","人物"],["阿曼达","不一定吧，普通人也可以是英雄啊，比如说花木兰。","ก็ไม่แน่เสมอไปนะ คนธรรมดาก็เป็นวีรบุรุษได้เหมือนกัน อย่างเช่นฮวามู่หลาน","不一定","普通人","英雄","比如说","花木兰"],["永民","迪士尼电影《花木兰》里的那个女孩子？","เด็กผู้หญิงคนนั้นในภาพยนตร์ดิสนีย์เรื่อง “มู่หลาน” ใช่ไหม","迪士尼","电影","花木兰"],["阿曼达","对啊。花木兰假扮男人，代替她的父亲参军。在古代中国，一个女孩子能这么做，真是不简单。","ใช่แล้ว ฮวามู่หลานปลอมตัวเป็นผู้ชายเพื่อไปเป็นทหารแทนพ่อของเธอ ในจีนสมัยโบราณ เด็กผู้หญิงคนหนึ่งทำแบบนี้ได้ ไม่ธรรมดาเลย","假扮","代替","父亲","参军","古代","不简单"],["永民","你肯定那个故事是真实的吗？","คุณแน่ใจหรือว่าเรื่องนั้นเป็นเรื่องจริง","肯定","故事","真实"],["阿曼达","这个……我不太肯定。","เรื่องนี้...ฉันก็ไม่ค่อยแน่ใจ","肯定"],["永民","传说中的人物，我觉得不能写吧。你认为李小龙怎么样？","ถ้าเป็นบุคคลในตำนาน ฉันว่าเขียนไม่ได้มั้ง คุณคิดว่าบรูซ ลีเป็นอย่างไร","传说","人物","认为","李小龙"],["阿曼达","功夫明星李小龙？不行吧。他只是个演员啊。","บรูซ ลี ดารากังฟูน่ะเหรอ ไม่น่าได้มั้ง เขาก็เป็นแค่นักแสดงเอง","功夫","明星","李小龙","演员"],["永民","他不只是个演员。他多次说过：“我首先是一个武术家，然后才是演员。”是他把中国功夫介绍给了世界。","เขาไม่ได้เป็นแค่นักแสดง เขาเคยพูดหลายครั้งว่า “ก่อนอื่นผมเป็นนักศิลปะการต่อสู้ แล้วจึงเป็นนักแสดง” เขาเป็นคนแนะนำกังฟูจีนให้โลกรู้จัก","演员","多次","首先","武术家","功夫","介绍给","世界"],["阿曼达","有道理。那你就写他吧。你觉得郑和怎么样？","ฟังดูมีเหตุผล งั้นคุณก็เขียนเรื่องเขาสิ แล้วคุณคิดว่าเจิ้งเหอเป็นอย่างไร","有道理","郑和"]];
const lines2=[["永民","明朝的航海家？他有那么重要吗？","นักเดินเรือสมัยราชวงศ์หมิงเหรอ เขาสำคัญขนาดนั้นเลยหรือ","明朝","航海家","重要"],["阿曼达","当然了。郑和出海到了东南亚、印度，甚至到了非洲；中国与很多国家和地区的贸易和文化交流，是从他出海开始的。我认为他对中国历史发展的影响，比李小龙大多了。","แน่นอน เจิ้งเหอเดินเรือไปถึงเอเชียตะวันออกเฉียงใต้ อินเดีย และแม้แต่แอฟริกา การค้าและการแลกเปลี่ยนวัฒนธรรมระหว่างจีนกับหลายประเทศและหลายภูมิภาคเริ่มต้นจากการเดินเรือของเขา ฉันคิดว่าอิทธิพลของเขาต่อพัฒนาการทางประวัติศาสตร์ของจีนมีมากกว่าบรูซ ลีมาก","当然","郑和","出海","东南亚","印度","甚至","非洲","国家","地区","贸易","文化","交流","开始","认为","影响","发展"],["永民","我不同意你的看法。历史上的航海家那么多，没什么了不起。","ฉันไม่เห็นด้วยกับความคิดเห็นของคุณ นักเดินเรือในประวัติศาสตร์มีตั้งเยอะ ไม่เห็นจะมีอะไรพิเศษ","不同意","看法","历史","航海家","了不起"],["阿曼达","我认为郑和的生平很值得写。他七次出海，后来很多人使用的航海图都可能是他留下的呢。","ฉันคิดว่าประวัติชีวิตของเจิ้งเหอน่าเขียนมาก เขาออกทะเลถึงเจ็ดครั้ง แผนที่เดินเรือที่คนจำนวนมากใช้ในภายหลังอาจเป็นสิ่งที่เขาทิ้งไว้ก็ได้นะ","认为","生平","值得","出海","使用","航海图","可能","留下"],["永民","是吗？那你就写郑和吧。","อย่างนั้นเหรอ งั้นคุณก็เขียนเรื่องเจิ้งเหอสิ","郑和"]];

').hidden=false;document.querySelector('.top').inert=true;document.querySelector('.wrap').inert=true;document.getElementById('detail').inert=true;renderTour();requestAnimationFrame(()=>document.getElementById('tourNext').focus())}document.getElementById('tourNext').addEventListener('click',()=>{if(tourIndex===tourSteps[lang].length-1){finishTour();return}tourIndex++;renderTour()});document.getElementById('tourPrevious').addEventListener('click',()=>{if(tourIndex>0){tourIndex--;renderTour()}});document.getElementById('tourSkip').addEventListener('click',finishTour);document.getElementById('tourClose').addEventListener('click',finishTour);document.addEventListener('keydown',e=>{if(!tourOpen)return;if(e.key==='Escape'){e.preventDefault();finishTour();return}if(e.key==='Tab'){const buttons=[...document.querySelectorAll('#tourCard button:not([disabled])')],first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});window.addEventListener('resize',positionTour);document.getElementById('dialogue').addEventListener('scroll',positionTour,{passive:true});function wordMarkup(text){const keys=Object.keys(words).sort((a,b)=>b.length-a.length);let out='',plain='',i=0,tone=0;const flush=()=>{if(plain){out+=annotate(plain);plain=''}};while(i<text.length){const hit=keys.find(key=>text.startsWith(key,i));if(hit){flush();out+='<span class="word word-tone-'+(tone++%3)+'" data-word="'+hit+'"><span class="pinyin">'+words[hit][0]+'</span><span class="hanzi">'+hit+'</span></span>';i+=hit.length}else{plain+=text[i];i++}}flush();return out}
function dialogueMarkup(item,index){const [speaker,sentence,translation]=item.line;const student=speaker==='阿曼达';const name=speaker==='阿曼达和永民'?'阿曼达 · 永民':speaker;const avatar=pixelAvatar(speaker);return `<li class="message ${student?'right':''} ${openEntry===index?'open':''} ${index===revealed?'enter':''}" data-entry="${index}"><div class="avatar ${student?'is-student':''}">${avatar}</div><div class="bubble-wrap"><div class="name">${name}</div><div class="bubble"><div class="cn" lang="zh-Hans">${wordMarkup(sentence)}<button class="translate-hint" type="button" aria-expanded="${openEntry===index}" aria-label="${openEntry===index?terms[lang].collapse:terms[lang].expand}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 6 4.5 4.5L12.5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><div class="translation">${translation}</div></div></div></li>`}
function rowsForLesson(){const rows=[];let previous='';allEntries.forEach((item,index)=>{if(item.scene!==previous){rows.push({type:'scene',scene:item.scene});previous=item.scene}rows.push({type:'dialogue',scene:item.scene,index,item})});return rows}
function buildPages(anchorIndex){const list=document.getElementById('dialogue');const oldEntry=pages[page]?.entries?.[0]?.index;const anchor=Number.isInteger(anchorIndex)?anchorIndex:(Number.isInteger(oldEntry)?oldEntry:0);const rows=rowsForLesson();list.innerHTML=rows.map(row=>row.type==='scene'?`<li class="scene-break" data-scene="${row.scene}">${terms[lang][row.scene]}</li>`:dialogueMarkup(row.item,row.index)).join('');const nodes=[...list.children];const gap=parseFloat(getComputedStyle(list).rowGap)||0;const available=list.clientHeight;let groups=[],current=[],used=0;rows.forEach((row,i)=>{if(row.type==='scene'){const nextHeight=nodes[i+1]?.offsetHeight||0;if(!current.length)return;const sceneHeight=nodes[i].offsetHeight;if(used+gap+sceneHeight+gap+nextHeight>available){groups.push(current);current=[];used=0;return}used+=gap;current.push(row);used+=sceneHeight;return}const height=nodes[i].offsetHeight;const extra=current.length?gap:0;if(current.length&&used+extra+height>available){groups.push(current);current=[];used=0}if(current.length)used+=gap;current.push(row);used+=height});if(current.length)groups.push(current);if(!groups.length)groups=[[]];pages=groups.map(group=>{const first=group.find(row=>row.type==='dialogue');return{scene:first?.scene||'frontDesk',rows:group,entries:group.filter(row=>row.type==='dialogue')}});const target=openEntry??anchor;page=pages.findIndex(group=>group.entries.some(row=>row.index===target));if(page<0)page=0;renderPage()}
function renderPage(){const data=pages[page]||{scene:'frontDesk',rows:[],entries:[]};const pageEntries=data.entries.map(row=>row.index);if(revealed<0)revealed=pageEntries[0]??0;document.getElementById('heading').textContent=terms[lang][data.scene];document.getElementById('dialogue').innerHTML=data.rows.map(row=>row.type==='scene'?'<li class="scene-break">'+terms[lang][row.scene]+'</li>':row.index<=revealed?dialogueMarkup(row.item,row.index):'').join('');document.getElementById('counter').textContent=(page+1)+' / '+pages.length+' '+terms[lang].page;document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===pages.length-1;document.getElementById('prev').textContent=terms[lang].prev;document.getElementById('next').textContent=terms[lang].next;const step=document.getElementById('step'),nextEntry=allEntries.findIndex((item,index)=>index>revealed);step.textContent=nextEntry<0?terms[lang].done:terms[lang].step;step.setAttribute('aria-label',nextEntry<0?terms[lang].done:terms[lang].step);step.title=nextEntry<0?terms[lang].done:terms[lang].step;step.disabled=nextEntry<0;const progress=document.getElementById('progress');progress.max=allEntries.length-1;progress.value=revealed;progress.style.setProperty('--progress',(revealed/(allEntries.length-1)*100)+'%')}
function updateInterface(){const t=terms[lang];document.documentElement.lang=lang==='th'?'th':'zh-CN';document.getElementById('brand').textContent=t.brand;document.getElementById('posLabel').textContent=t.pos;document.getElementById('meaningLabel').textContent=t.meaning;document.getElementById('usageLabel').textContent=t.usage;document.getElementById('exampleLabel').textContent=t.example;document.getElementById('pinyinLabel').textContent=t.pinyin;document.getElementById('sizeLabel').textContent=t.size;document.getElementById('close').setAttribute('aria-label',t.close);document.querySelector('[data-size=small]').textContent=t.small;document.querySelector('[data-size=medium]').textContent=t.medium;document.querySelector('[data-size=large]').textContent=t.large}
document.getElementById('lang').addEventListener('change',e=>{lang=e.target.value;updateInterface();buildPages()});document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{scale={small:1.05,medium:1.18,large:1.34}[button.dataset.size];document.documentElement.style.setProperty('--scale',scale);document.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('active',b===button));buildPages()}));document.getElementById('pinyin').addEventListener('change',e=>{document.body.classList.toggle('hide-pinyin',!e.target.checked);buildPages()});document.getElementById('prev').addEventListener('click',()=>{if(page>0){page--;revealed=pages[page].entries.at(-1)?.index??-1;openEntry=null;playBubble();renderPage()}});document.getElementById('next').addEventListener('click',()=>{if(page<pages.length-1){page++;revealed=pages[page].entries[0]?.index??-1;openEntry=null;playBubble();renderPage()}});let audioContext;function playBubble(){try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const s=audioContext.currentTime,o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.setValueAtTime(620,s);o.frequency.exponentialRampToValueAtTime(310,s+.11);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.08,s+.014);g.gain.exponentialRampToValueAtTime(.0001,s+.16);o.connect(g);g.connect(audioContext.destination);o.start(s);o.stop(s+.17)}catch(e){}}function setProgress(index){revealed=Math.max(0,Math.min(allEntries.length-1,Number(index)));page=pages.findIndex(group=>group.entries.some(row=>row.index===revealed));if(page<0)page=0;openEntry=null;playBubble();renderPage()}function revealNext(){if(revealed>=allEntries.length-1)return;revealed++;page=pages.findIndex(group=>group.entries.some(row=>row.index===revealed));if(page<0)page=pages.length-1;playBubble();renderPage()}document.getElementById('step').addEventListener('click',revealNext);document.getElementById('progress').addEventListener('input',e=>setProgress(e.target.value));document.getElementById('dialogue').addEventListener('click',e=>{const hint=e.target.closest('.translate-hint');if(hint){const message=hint.closest('[data-entry]'),index=Number(message.dataset.entry);openEntry=openEntry===index?null:index;message.classList.toggle('open',openEntry===index);hint.setAttribute('aria-expanded',String(openEntry===index));hint.setAttribute('aria-label',openEntry===index?terms[lang].collapse:terms[lang].expand);if(openEntry===index)requestAnimationFrame(()=>message.scrollIntoView({block:'nearest',behavior:'smooth'}));return}const word=e.target.closest('[data-word]');if(word){const d=words[word.dataset.word];document.getElementById('dw').textContent=word.dataset.word;document.getElementById('dp').textContent=d[0];document.getElementById('dpos').textContent=partNames[lang][d[1]]||partNames[lang].phrase;document.getElementById('dm').textContent=d[2];document.getElementById('dt').textContent=d[3];document.getElementById('de').textContent=d[4];document.getElementById('dthai').textContent=d[5];document.getElementById('detail').classList.add('show');liftWord(word)}});document.getElementById('story').addEventListener('click',e=>{if(e.target.closest('button,[data-word]'))return;revealNext()});document.getElementById('close').addEventListener('click',()=>document.getElementById('detail').classList.remove('show'));function dismissDetailOutside(e){const detail=document.getElementById('detail');if(detail.classList.contains('show')&&!detail.contains(e.target)&&!e.target.closest('[data-word]'))detail.classList.remove('show')}document.addEventListener('pointerdown',dismissDetailOutside,true);document.addEventListener('click',dismissDetailOutside,true);let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>buildPages(),100)});function pixelAvatar(speaker){const m={'服务员':'服','马克':'马','阿曼达':'曼','永民':'民','阿曼达和永民':'合'};return '<span class="seal-char" lang="zh-Hans" aria-hidden="true">'+(m[speaker]||speaker[0])+'</span>'}
function liftWord(word){document.querySelectorAll('.word.picked').forEach(w=>w.classList.remove('picked'));word.classList.add('picked');requestAnimationFrame(()=>{const sheet=document.getElementById('detail'),list=document.getElementById('dialogue'),r=word.getBoundingClientRect(),limit=innerHeight-sheet.offsetHeight-24;const top=list.getBoundingClientRect().top;if(r.bottom>limit)list.scrollTop+=r.bottom-limit;else if(r.top<top)list.scrollTop-=top-r.top})}
new MutationObserver(()=>{if(!document.getElementById('detail').classList.contains('show'))document.querySelectorAll('.word.picked').forEach(w=>w.classList.remove('picked'))}).observe(document.getElementById('detail'),{attributes:true,attributeFilter:['class']});
