function renderPage(){const data=pages[page]||{scene:'frontDesk',rows:[],entries:[]};const pageEntries=data.entries.map(row=>row.index);if(revealed<0)revealed=pageEntries[0]??0;document.getElementById('heading').textContent=terms[lang][data.scene];document.getElementById('dialogue').innerHTML=data.rows.map(row=>row.type==='scene'?'<li class="scene-break">'+terms[lang][row.scene]+'</li>':row.index<=revealed?dialogueMarkup(row.item,row.index):'').join('');document.getElementById('counter').textContent=(page+1)+' / '+pages.length+' '+terms[lang].page;document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===pages.length-1;document.getElementById('prev').textContent=terms[lang].prev;document.getElementById('next').textContent=terms[lang].next;const step=document.getElementById('step'),nextEntry=allEntries.findIndex((item,index)=>index>revealed);step.textContent=nextEntry<0?terms[lang].done:terms[lang].step;step.setAttribute('aria-label',nextEntry<0?terms[lang].done:terms[lang].step);step.title=nextEntry<0?terms[lang].done:terms[lang].step;step.disabled=nextEntry<0;const progress=document.getElementById('progress');progress.max=allEntries.length-1;progress.value=revealed;progress.style.setProperty('--progress',(revealed/(allEntries.length-1)*100)+'%')}

document.getElementById('lang').addEventListener('change',e=>{lang=e.target.value;updateInterface();buildPages()});document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{scale={small:1.05,medium:1.18,large:1.34}[button.dataset.size];document.documentElement.style.setProperty('--scale',scale);document.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('active',b===button));buildPages()}));document.getElementById('pinyin').addEventListener('change',e=>{document.body.classList.toggle('hide-pinyin',!e.target.checked);buildPages()});document.getElementById('prev').addEventListener('click',()=>{if(page>0){page--;revealed=pages[page].entries.at(-1)?.index??-1;openEntry=null;playBubble();renderPage()}});document.getElementById('next').addEventListener('click',()=>{if(page<pages.length-1){page++;revealed=pages[page].entries[0]?.index??-1;openEntry=null;playBubble();renderPage()}});let audioContext;function playBubble(){try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const s=audioContext.currentTime,o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.setValueAtTime(620,s);o.frequency.exponentialRampToValueAtTime(310,s+.11);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.08,s+.014);g.gain.exponentialRampToValueAtTime(.0001,s+.16);o.connect(g);g.connect(audioContext.destination);o.start(s);o.stop(s+.17)}catch(e){}}function setProgress(index){revealed=Math.max(0,Math.min(allEntries.length-1,Number(index)));page=pages.findIndex(group=>group.entries.some(row=>row.index===revealed));if(page<0)page=0;openEntry=null;playBubble();renderPage()}function revealNext(){if(revealed>=allEntries.length-1)return;revealed++;page=pages.findIndex(group=>group.entries.some(row=>row.index===revealed));if(page<0)page=pages.length-1;playBubble();renderPage()}document.getElementById('step').addEventListener('click',revealNext);document.getElementById('progress').addEventListener('input',e=>setProgress(e.target.value));document.getElementById('dialogue').addEventListener('click',e=>{const hint=e.target.closest('.translate-hint');if(hint){const message=hint.closest('[data-entry]'),index=Number(message.dataset.entry);openEntry=openEntry===index?null:index;message.classList.toggle('open',openEntry===index);hint.setAttribute('aria-expanded',String(openEntry===index));hint.setAttribute('aria-label',openEntry===index?terms[lang].collapse:terms[lang].expand);if(openEntry===index)requestAnimationFrame(()=>message.scrollIntoView({block:'nearest',behavior:'smooth'}));return}const word=e.target.closest('[data-word]');if(word){const d=words[word.dataset.word];document.getElementById('dw').textContent=word.dataset.word;document.getElementById('dp').textContent=d[0];document.getElementById('dpos').textContent=partNames[lang][d[1]]||partNames[lang].phrase;document.getElementById('dm').textContent=d[2];document.getElementById('dt').textContent=d[3];document.getElementById('de').textContent=d[4];document.getElementById('dthai').textContent=d[5];document.getElementById('detail').classList.add('show');liftWord(word)}});document.getElementById('story').addEventListener('click',e=>{if(e.target.closest('button,[data-word]'))return;revealNext()});document.getElementById('close').addEventListener('click',()=>document.getElementById('detail').classList.remove('show'));function dismissDetailOutside(e){const detail=document.getElementById('detail');if(detail.classList.contains('show')&&!detail.contains(e.target)&&!e.target.closest('[data-word]'))detail.classList.remove('show')}document.addEventListener('pointerdown',dismissDetailOutside,true);document.addEventListener('click',dismissDetailOutside,true);let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>buildPages(),100)});function pixelAvatar(speaker){const staff=['售票员','导游'].includes(speaker);const female=['售票员','阿曼达'].includes(speaker);const rows=female?['.hhhhhh.','hhhhhhhh','hssssssh','hseesesh','hssssssh','..ssss..','..bbbb..','.bbbbbb.','.b....b.']:staff?['..hhhh..','.hhhhhh.','.hssss h.'.replaceAll(' ',''),'.hs e s h.'.replaceAll(' ',''),'.hssssh.','..ssss..','..gggg..','.gggggg.','.g....g.']:['..hhhh..','.hhhhhh.','.hssss h.'.replaceAll(' ',''),'.hs e s h.'.replaceAll(' ',''),'.hssssh.','..ssss..','..bbbb..','.bbbbbb.','.b....b.'];const colors={h:'#49372e',s:'#e8b99b',e:'#342d2a',g:'#315e4c',b:'#567b91'};const cells=rows.flatMap((row,y)=>[...row].map((cell,x)=>cell==='.'?'':'<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+colors[cell]+'"/>').filter(Boolean)).join('');return '<svg class="pixel-art" viewBox="0 0 8 9" aria-hidden="true" shape-rendering="crispEdges">'+cells+'</svg>'}
function liftWord(word){document.querySelectorAll('.word.picked').forEach(w=>w.classList.remove('picked'));word.classList.add('picked');requestAnimationFrame(()=>{const sheet=document.getElementById('detail'),list=document.getElementById('dialogue'),r=word.getBoundingClientRect(),limit=innerHeight-sheet.offsetHeight-24;const top=list.getBoundingClientRect().top;if(r.bottom>limit)list.scrollTop+=r.bottom-limit;else if(r.top<top)list.scrollTop-=top-r.top})}
new MutationObserver(()=>{if(!document.getElementById('detail').classList.contains('show'))document.querySelectorAll('.word.picked').forEach(w=>w.classList.remove('picked'))}).observe(document.getElementById('detail'),{attributes:true,attributeFilter:['class']});
if(new URLSearchParams(location.search).has('embed'))tourSteps[lang]=tourSteps[lang].filter(step=>step.target!=='#lang');updateInterface();buildPages(0);startTour();
</script></body></html>
