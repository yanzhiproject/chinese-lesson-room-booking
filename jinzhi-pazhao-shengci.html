let lang=localStorage.getItem('airport-course-lang')||'th',index=0,screen='study',questions=[],q=0,score=0,answered=false,timer=null,timerInterval=null,left=10,results=[];const testable=words.filter(w=>w.pos!=='proper');function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}function pyLine(text){return [...text].map(c=>/[一-鿿]/.test(c)?(pinyinMap[c]||''):c).filter(Boolean).join(' ')}function paintLang(){document.documentElement.lang=lang==='th'?'th':'zh-CN';document.getElementById('lang').value=lang;document.querySelectorAll('[data-t]').forEach(el=>{let key=el.dataset.t;if(key==='pos')return;el.textContent=strings[lang][key]||key});if(screen==='study')renderWord()}function renderWord(){const w=words[index],t=strings[lang];const artShapes={"售票员":'<circle cx="110" cy="38" r="16" fill="#d9a67f"/><path d="M80 62h60l12 40H68z" fill="#54786a"/><path d="M96 74h28v22H96z" fill="#fffdf7" stroke="#31544d" stroke-width="3"/>',"售票":'<path d="M62 44h96v18a10 10 0 0 0 0 20v18H62V80a10 10 0 0 0 0-20z" fill="#fffdf7" stroke="#31544d" stroke-width="3"/><path d="M82 61h34m-34 11h27" stroke="#b6533f" stroke-width="3"/>',"证":'<rect x="68" y="26" width="84" height="76" rx="9" fill="#fffdf7" stroke="#31544d" stroke-width="3"/><path d="M68 43h84" stroke="#31544d" stroke-width="12"/><circle cx="91" cy="68" r="9" fill="#d9a67f"/><path d="M80 88q11-16 22 0m14-20h24m-24 10h24" stroke="#54786a" stroke-width="3"/>',"导游":'<circle cx="106" cy="40" r="15" fill="#d9a67f"/><path d="M79 66h54l12 36H67z" fill="#986c49"/><path d="M147 70V30m0 0h26l-8 11 8 10h-26" fill="#b6533f" stroke="#31544d" stroke-width="3"/>',"入口处":'<path d="M73 102V30q37-16 74 0v72z" fill="#d6c4a5" stroke="#31544d" stroke-width="4"/><path d="M88 102V39q22-9 44 0v63" fill="#fffdf7" stroke="#31544d" stroke-width="3"/><circle cx="123" cy="71" r="3" fill="#b6533f"/>',"农民":'<circle cx="108" cy="45" r="15" fill="#d9a67f"/><path d="M82 41q4-24 52-12l8 15z" fill="#b6533f"/><path d="M78 68h60l12 34H66z" fill="#54786a"/><path d="M84 86h48" stroke="#fffdf7" stroke-width="5"/>',"井":'<ellipse cx="110" cy="53" rx="46" ry="14" fill="#d6c4a5" stroke="#31544d" stroke-width="4"/><path d="M64 53v43q46 24 92 0V53" fill="#afc2bb" stroke="#31544d" stroke-width="4"/><ellipse cx="110" cy="53" rx="28" ry="8" fill="#596e68"/>',"汉语":'<path d="M66 30q23-10 44 4v67q-21-13-44-5z" fill="#fffdf7" stroke="#31544d" stroke-width="3"/><path d="M154 30q-23-10-44 4v67q21-13 44-5z" fill="#eee4d2" stroke="#31544d" stroke-width="3"/><path d="M75 50h26m-26 10h26m37-10h10m-10 10h10" stroke="#b6533f" stroke-width="3"/>',"声":'<path d="M72 51h20l24-18v62L92 77H72z" fill="#54786a"/><path d="M127 47q18 18 0 36m11-47q29 29 0 58" fill="none" stroke="#b6533f" stroke-width="4" stroke-linecap="round"/>',"送":'<rect x="69" y="51" width="82" height="52" rx="5" fill="#c96a52"/><path d="M64 42h92v17H64z" fill="#b6533f"/><path d="M110 42q-30-2-21-17 12-10 21 17 8-28 23-16 8 12-23 16z" fill="#d7aa58"/><path d="M110 44v59" stroke="#fff4d4" stroke-width="6"/>',"指示牌":'<rect x="75" y="23" width="70" height="76" rx="4" fill="#fffdf7" stroke="#31544d" stroke-width="4"/><path d="M91 44h38m-38 13h30m-30 13h37m-33 29v13" stroke="#31544d" stroke-width="4" stroke-linecap="round"/>',"兵马俑":'<path d="M85 102V69q0-19 25-22 25 3 25 22v33z" fill="#9a7652" stroke="#684d36" stroke-width="3"/><path d="M91 58l5-25h28l5 25" fill="#b28d64" stroke="#684d36" stroke-width="3"/><circle cx="102" cy="47" r="2" fill="#342c25"/><circle cx="118" cy="47" r="2" fill="#342c25"/><path d="M101 57q9 5 18 0m-22 20h26m-26 9h26" fill="none" stroke="#684d36" stroke-width="3"/>'};const art=wordVisuals[w.word];const artEl=document.getElementById("wordIllustration");artEl.innerHTML=art?`<svg viewBox="0 0 220 132" class="mini-art" aria-hidden="true"><rect width="220" height="132" rx="16" fill="#f1f0e8"/><circle cx="178" cy="24" r="28" fill="#fffdf7"/>${artShapes[w.word]||""}<text x="110" y="120" text-anchor="middl function startTest(){screen='test';document.getElementById('study').classList.add('hide');document.getElementById('test').classList.remove('hide');questions=shuffle(testable).slice(0,20).map((w,i)=>({w,kind:(i%3===2&&w.example.includes(w.word))?'context':i%2?'word':'meaning'}));q=0;score=0;results=[];renderQ()}
function makeOptions(question){const others=shuffle(testable.filter(x=>x.word!==question.w.word)).slice(0,3);const showMeaning=question.kind==='word';const label=w=>w.word;return shuffle([{label:label(question.w),id:question.w.word,correct:true},...others.map(w=>({label:label(w),id:w.word}))])}
function renderQ(){clearInterval(timerInterval);clearTimeout(timer);answered=false;left=10;const t=strings[lang],question=questions[q],w=question.w;const title=question.kind==='context'?t.chooseContext:t.chooseMeaning;let prompt=question.kind==='word'?`<div class="q-context">${lang==='th'?w.bookTh:w.meaningZh}</div>`:question.kind==='context'?`<div class="q-context">${w.example.replace(w.word,'＿＿＿')}</div>`:`<div class="q-context">${lang==='th'?w.bookTh:w.meaningZh}</div>`;const options=makeOptions(question);document.getElementById('test').innerHTML=`<div class="study-head"><div><p class="q-kicker">${t.testTitle}</p><h2 class="section-title">${t.qOf} ${q+1} / 20</h2></div><span class="count">${t.seconds} <b id="sec">10</b></span></div><div class="timer"><span id="timerBar"></span></div><p class="question">${title}</p>${prompt}<div class="options">${options.map(o=>`<button class="option" data-answer="${o.id}">${o.label}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><button class="btn primary hide" id="continue">${t.nextQuestion}</button>`;document.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.answer,false)));document.getElementById('continue').addEventListener('click',nextQ);timerInterval=setInterval(()=>{left--;const s=document.getElementById('sec');if(s)s.textContent=left;const bar=document.getElementById('timerBar');if(bar)bar.style.width=Math.max(0,left/10*100)+'%';if(left<=0)answer('',true)},1000)}
function answer(id,timeout){if(answered)return;answered=true;clearInterval(timerInterval);const item=questions[q],ok=id===item.w.word;if(ok)score++;results.push(ok);document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.dataset.answer===item.w.word)b.classList.add('correct');else if(b.dataset.answer===id&&!ok)b.classList.add('wrong')});const t=strings[lang];document.getElementById('feedback').textContent=(ok?'✓ '+t.correct:timeout?t.timedOut:t.wrong)+' · '+t.answerIs+'「'+item.w.word+'」 '+item.w.py+' — '+item.w.bookTh;document.getElementById('continue').classList.remove('hide');document.getElementById('continue').textContent=q===19?t.finish:t.nextQuestion}
function nextQ(){if(q<19){q++;renderQ()}else showResult()}function showResult(){clearInterval(timerInterval);clearTimeout(timer);screen='result';document.getElementById('progress').style.width='100%';const t=strings[lang],pct=Math.round(score/20*100),pass=pct>=60;localStorage.setItem('airport-vocab-best',String(Math.max(Number(localStorage.getItem('airport-vocab-best')||0),pct)));const id=localStorage.getItem('airport-vocab-student-id')||('AIR-'+Math.random().toString(36).slice(2,6).toUpperCase());localStorage.setItem('airport-vocab-student-id',id);document.getElementById('test').innerHTML=`<div class="result"><p class="kicker">${t.testTitle}</p><h2 class="title">${pass?t.passed:t.retry}</h2><div class="result-score">${pct}%</div><div>${t.scoreLabel}：${score} / 20</div><div class="result-id">${t.studentId}　${id}</div><p class="small-note">${pass?(lang==='th'?'คุณสามารถเข้าเรียนบทอ่านได้จากเมนู':'你可以从菜单直接进入课文学习'):t.retry}</p><div class="actions" style="justify-content:center;flex-wrap:wrap"><button class="btn" id="retry">${t.tryAgain}</button><a class="btn" href="jinzhi-pazhao.html">${t.backMenu}</a><a class="btn primary" href="jinzhi-pazhao-kewen.html">${t.openReading}</a></div></div>`;document.getElementById('retry').addEventListener('click',startTest)}
document.getElementById('lang').addEventListener('change',e=>{lang=e.target.value;localStorage.setItem('airport-course-lang',lang);paintLang();if(screen==='test'&&questions.length)renderQ();if(screen==='result')showResult()});document.getElementById('prev').addEventListener('click',()=>{if(index>0){index--;renderWord()}});document.getElementById('next').addEventListener('click',()=>{if(index<words.length-1){index++;renderWord()}else startTest()});document.getElementById('startTest').addEventListener('click',startTest);paintLang();renderWord();
</script></body></html>
