function startTest(){screen='test';document.querySelector('main>.study-head').classList.add('hide');document.querySelector('main>.progress').classList.add('hide');document.getElementById('study').classList.add('hide');document.getElementById('test').classList.remove('hide');let previousOrder=lastTestOrder;try{previousOrder=localStorage.getItem('forbidden-photo-last-test-order')||lastTestOrder}catch(e){}let selected=shuffle(testable).slice(0,20),order=selected.map(w=>w.word).join('|');if(order===previousOrder&&selected.length>1){selected=selected.slice(1).concat(selected[0]);order=selected.map(w=>w.word).join('|')}lastTestOrder=order;try{localStorage.setItem('forbidden-photo-last-test-order',order)}catch(e){}questions=selected.map((w,i)=>({w,kind:(i%3===2&&w.example.includes(w.word))?'context':i%2?'word':'meaning'}));q=0;score=0;results=[];renderQ()}
function makeOptions(question){const others=shuffle(testable.filter(x=>x.word!==question.w.word)).slice(0,3);const showMeaning=question.kind==='word';const label=w=>w.word;return shuffle([{label:label(question.w),id:question.w.word,correct:true},...others.map(w=>({label:label(w),id:w.word}))])}
function renderQ(){clearInterval(timerInterval);clearTimeout(timer);answered=false;left=15;const t=strings[lang],question=questions[q],w=question.w;const title=question.kind==='context'?t.chooseContext:t.chooseMeaning;let prompt=question.kind==='word'?`<div class="q-context">${w.bookTh}</div>`:question.kind==='context'?`<div class="q-context">${w.example.replace(w.word,'＿＿＿')}</div>`:`<div class="q-context">${w.bookTh}</div>`;const options=makeOptions(question);document.getElementById('test').innerHTML=`<div class="study-head"><div><p class="q-kicker">${t.testTitle}</p><h2 class="section-title">${t.qOf} ${q+1} / 20</h2></div><span class="count">${t.seconds} <b id="sec">15</b></span></div><div class="timer"><span id="timerBar"></span></div><p class="question">${title}</p>${prompt}<div class="options">${options.map(o=>`<button class="option" data-answer="${o.id}">${o.label}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><button class="btn primary hide" id="continue">${t.nextQuestion}</button>`;document.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>answer(b.dataset.answer,false)));document.getElementById('continue').addEventListener('click',nextQ);timerInterval=setInterval(()=>{left--;const s=document.getElementById('sec');if(s)s.textContent=left;const bar=document.getElementById('timerBar');if(bar)bar.style.width=Math.max(0,left/15*100)+'%';if(left<=0)answer('',true)},1000)}
function answer(id,timeout){if(answered)return;answered=true;clearInterval(timerInterval);const item=questions[q],ok=id===item.w.word;if(ok)score++;results.push(ok);document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.dataset.answer===item.w.word)b.classList.add('correct');else if(b.dataset.answer===id&&!ok)b.classList.add('wrong')});const t=strings[lang];document.getElementById('feedback').textContent=(ok?'✓ '+t.correct:timeout?t.timedOut:t.wrong)+' · '+t.answerIs+'「'+item.w.word+'」 '+item.w.py+' — '+item.w.bookTh;document.getElementById('continue').classList.remove('hide');document.getElementById('continue').textContent=q===19?t.finish:t.nextQuestion}
function nextQ(){if(q<19){q++;renderQ()}else showResult()}function showResult(){clearInterval(timerInterval);clearTimeout(timer);screen='result';document.getElementById('progress').style.width='100%';const t=strings[lang],pct=Math.round(score/20*100),pass=pct>=60;localStorage.setItem('forbidden-photo-vocab-best',String(Math.max(Number(localStorage.getItem('forbidden-photo-vocab-best')||0),pct)));const id=localStorage.getItem('forbidden-photo-vocab-student-id')||('MUS-'+Math.random().toString(36).slice(2,6).toUpperCase());localStorage.setItem('forbidden-photo-vocab-student-id',id);document.getElementById('test').innerHTML=`<div class="result"><p class="kicker">${t.testTitle}</p><h2 class="title">${pass?t.passed:t.retry}</h2><div class="result-score">${pct}%</div><div>${t.scoreLabel}：${score} / 20</div><div class="result-id">${t.studentId}　${id}</div><p class="small-note">${pass?(lang==='th'?'ผ่านเกณฑ์แล้ว สามารถเริ่มเรียนบทอ่านได้':'已达到60%，可以进入课文学习。'):t.retry}</p><div class="actions" style="justify-content:center;flex-wrap:wrap"><button class="btn" id="retry">${t.tryAgain}</button>${pass?`<a class="btn primary" href="jinzhi-pazhao-kewen.html?v=20261124-jpz15-thai-audio">${t.openReading}</a>`:''}</div></div>`;document.getElementById('retry').addEventListener('click',startTest)}
const flipCard=document.getElementById('flipCard');const cardPalettes=['jade','peach','sky','lavender','rose','butter'];function setCardFlipped(flipped){flipCard.classList.toggle('flipped',flipped);flipCard.setAttribute('aria-pressed',String(flipped));flipCard.setAttribute('aria-label',strings[lang][flipped?'showWord':'showDetails']);document.getElementById('flipFront').setAttribute('aria-hidden',String(flipped));document.getElementById('flipBack').setAttribute('aria-hidden',String(!flipped));document.getElementById('flipHint').textContent=strings[lang][flipped?'showWord':'showDetails'];document.getElementById('flipHintBack').textContent=strings[lang][flipped?'showWord':'showDetails']}let swipeStart=null,suppressCardClick=false,suppressClickTimer=0;function toggleCardFace(){setCardFlipped(!flipCard.classList.contains('flipped'))}function stepWord(delta){const next=Math.max(0,Math.min(words.length-1,index+delta));if(next===index)return;setCardFlipped(false);index=next;renderWord()}flipCard.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')swipeStart={id:e.pointerId,x:e.clientX,y:e.clientY}});flipCard.addEventListener('pointerup',e=>{if(!swipeStart||e.pointerId!==swipeStart.id)return;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>44&&Math.abs(dx)>Math.abs(dy)*1.15){e.preventDefault();suppressCardClick=true;stepWord(dx<0?1:-1);clearTimeout(suppressClickTimer);suppressClickTimer=setTimeout(()=>suppressCardClick=false,600)}});flipCard.addEventListener('pointercancel',()=>{swipeStart=null});flipCard.addEventListener('click',()=>{if(suppressCardClick){suppressCardClick=false;return}toggleCardFace()});flipCard.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();stepWord(e.key==='ArrowLeft'?-1:1)}else if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleCardFace()}});document.getElementById('lang').addEventListener('change',e=>{lang=e.target.value;localStorage.setItem('for
