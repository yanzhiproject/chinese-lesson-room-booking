rd.style.visibility='hidden';card.style.transform='none';if(target){const r=target.getBoundingClientRect(),pad=5;spot.hidden=false;spot.style.left=Math.max(4,r.left-pad)+'px';spot.style.top=Math.max(4,r.top-pad)+'px';spot.style.width=Math.min(innerWidth-8,r.width+pad*2)+'px';spot.style.height=Math.min(innerHeight-8,r.height+pad*2)+'px'}else{spot.hidden=true}const cr=card.getBoundingClientRect(),margin=12;if(!target){card.style.left='50%';card.style.top='50%';card.style.transform='translate(-50%,-50%)'}else{const r=target.getBoundingClientRect(),left=Math.max(margin,Math.min(r.left,innerWidth-cr.width-margin)),below=r.bottom+14+cr.height<=innerHeight-margin,top=below?r.bottom+14:Math.max(margin,r.top-cr.height-14);card.style.left=left+'px';card.style.top=top+'px'}card.style.visibility='visible'}function renderTour(){const steps=tourSteps[lang],step=steps[tourIndex],t=terms[lang],card=document.getElementById('tourCard');document.getElementById('tourLabel').textContent=t.tourTitle;document.getElementById('tourCount').textContent=(tourIndex+1)+' / '+steps.length;document.getElementById('tourProgress').style.width=((tourIndex+1)/steps.length*100)+'%';document.getElementById('tourHeading').textContent=step.title;document.getElementById('tourBody').textContent=step.body;document.getElementById('tourSkip').textContent=t.tourSkip;const previous=document.getElementById('tourPrevious');previous.textContent=t.tourPrevious;previous.disabled=tourIndex===0;document.getElementById('tourNext').textContent=tourIndex===steps.length-1?t.tourStart:t.tourNext;document.getElementById('tourClose').setAttribute('aria-label',t.tourClose);card.hidden=false;requestAnimationFrame(positionTour)}function startTour(){let seen=false;try{seen=localStorage.getItem('lesson-airport-tour-seen')==='1'}catch(e){}if(seen)return;tourOpen=true;focusBeforeTour=document.activeElement;document.getElementById('tourBackdrop').hidden=false;document.querySelector('.top').inert=true;document.querySelector('.wrap').inert=true;document.getElementById('detail').inert=true;renderTour();requestAnimationFrame(()=>document.getElementById('tourNext').focus())}document.getElementById('tourNext').addEventListener('click',()=>{if(tourIndex===tourSteps[lang].length-1){finishTour();return}tourIndex++;renderTour()});document.getElementById('tourPrevious').addEventListener('click',()=>{if(tourIndex>0){tourIndex--;renderTour()}});document.getElementById('tourSkip').addEventListener('click',finishTour);document.getElementById('tourClose').addEventListener('click',finishTour);document.addEventListener('keydown',e=>{if(!tourOpen)return;if(e.key==='Escape'){e.preventDefault();finishTour();return}if(e.key==='Tab'){const buttons=[...document.querySelectorAll('#tourCard button:not([disabled])')],first=buttons[0],last=buttons[buttons.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});window.addEventListener('resize',positionTour);document.getElementById('dialogue').addEventListener('scroll',positionTour,{passive:true});function wordMarkup(text){const keys=Object.keys(words).sort((a,b)=>b.length-a.length);let out='',plain='',i=0,tone=0;const flush=()=>{if(plain){out+=annotate(plain);plain=''}};while(i<text.length){const hit=keys.find(key=>text.startsWith(key,i));if(hit){flush();out+='<span class="word word-tone-'+(tone++%3)+'" data-word="'+hit+'"><span class="pinyin">'+words[hit][0]+'</span><span class="hanzi">'+hit+'</span></span>';i+=hit.length}else{plain+=text[i];i++}}flush();return out}
const portraitPalette={h:'#49372e',s:'#e8b99b',e:'#342d2a',m:'#a45b52',g:'#315e4c',b:'#567b91',a:'#c08a45',w:'#f5f2ed'};const portraitRows={service:['..hhhh..','.hhhhhh.','.hssss h.'.replaceAll(' ',''),'.hs e s h.'.replaceAll(' ',''),'.hssssh.','..ssss..','..gggg..','.gggggg.','.g....g.'],mark:['..hhhh..','.hhhhhh.','.hssss h.'.replaceAll(' ',''),'.hs e s h.'.replaceAll(' ',''),'.hssssh.','..ssss..','..bbbb..','.bbbbbb.','.b....b.'],amanda:['..hhhh..','.hhhhhh.','.hssss h.'.replaceAll(' ',''),'.hs e s h.'.replaceAll(' ',''),'.hssssh.','..ssss..','..aaaa..','.aaaaaa.','.a....a.'],yongmin:['..hhhh..','.hhhhhh.','.hssss h.'.replaceAll(' ',''),'.hs e s h.'.replaceAll(' ',''),'.hssssh.','..ssss..','..gggg..','.gggggg.','.g....g.'],duo:['..hhhh..','.hhhhhh.','.hssss h.'.replaceAll(' ',''),'.hs e s h.'.replaceAll(' ',''),'.hssssh.','..ssss..','..bbbb..','.bbbbbb.','.b....b.']};function pixelAvatar(speaker){const key=speaker==='服务员'?'service':speaker==='马克'?'mark':speaker==='阿曼达'?'amanda':speaker==='永民'?'yongmin':'duo';const cells=portraitRows[key].flatMap((row,y)=>[...row].map((cell,x)=>cell==='.'?'':'<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+portraitPalette[cell]+'"/>').filter(Boolean)).join('');const label=speaker==='服务员'?'服务员头像':speaker==='阿曼达和永民'?'阿曼达和永民头像':speaker+'头像';return '<svg class="pixel-art" viewBox="0 0 8 9" role="img" aria-label="'+label+'" shape-rendering="crispEdges">'+cells+'</svg>'}
function dialogueMarkup(item,index){const [speaker,sentence,translation]=item.line;if(speaker==='STAGE')return `<li class="stage-note" data-entry="${index}"><div class="cn" lang="zh-Hans">${wordMarkup(sentence)}</div><div class="translation" style="display:block">${translation}</div></li>`;const student=speaker==='史蒂夫';const name=speaker;const avatar=pixelAvatar(speaker);return `<li class="message ${student?'right':''} ${openEntry===index?'open':''} ${index===revealed?'enter':''}" data-entry="${index}"><div class="avatar ${student?'is-student':''}">${avatar}</div><div class="bubble-wrap"><div class="name">${name}</div><div class="bubble"><div class="cn" lang="zh-Hans">${wordMarkup(sentence)}<button class="translate-hint" type="button" aria-expanded="${openEntry===index}" aria-label="${openEntry===index?terms[lang].collapse:terms[lang].expand}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 6 4.5 4.5L12.5 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><div class="translation">${translation}</div></div></div></li>`}
function rowsForLesson(){const rows=[];let previous='';allEntries.forEach((item,index)=>{if(item.scene!==previous){rows.push({type:'scene',scene:item.scene});previous=item.scene}rows.push({type:'dialogue',scene:item.scene,index,item})});return rows}
function buildPages(anchorIndex){const list=document.getElementById('dialogue');const oldEntry=pages[page]?.entries?.[0]?.index;const anchor=Number.isInteger(anchorIndex)?anchorIndex:(Number.isInteger(oldEntry)?oldEntry:0);const rows=rowsForLesson();list.innerHTML=rows.map(row=>row.type==='scene'?`<li class="scene-break" data-scene="${row.scene}">${terms[lang][row.scene]}</li>`:dialogueMarkup(row.item,row.index)).join('');const nodes=[...list.children];const gap=parseFloat(getComputedStyle(list).rowGap)||0;const available=list.clientHeight;let groups=[],current=[],used=0;rows.forEach((row,i)=>{if(row.type==='scene'){const nextHeight=nodes[i+1]?.offsetHeight||0;if(!current.length)return;const sceneHeight=nodes[i].offsetHeight;if(used+gap+sceneHeight+gap+nextHeight>available){groups.push(current);current=[];used=0;return}used+=gap;current.push(row);used+=sceneHeight;return}const height=nodes[i].offsetHeight;const extra=current.length?gap:0;if(current.length&&used+extra+height>available){groups.push(current);current=[];used=0}if(current.length)used+=gap;current.push(row);used+=height});if(current.length)groups.push(current);if(!groups.length)groups=[[]];pages=groups.map(group=>{const first=group.find(row=>row.type==='dialogue');return{scene:first?.scene||'frontDesk',rows:group,entries:group.filter(row=>row.type==='dialogue')}});const target=openEntry??anchor;page=pages.findIndex(group=>group.entries.some(row=>row.index===target));if(page<0)page=0;renderPage()}
function renderPage(){const data=pages[page]||{scene:'frontDesk',rows:[],entries:[]};const pageEntries=data.entries.map(row=>row.index);if(revealed<0)revealed=pageEntries[0]??0;document.getElementById('heading').textContent=terms[lang][data.scene];document.getElementById('dialogue').innerHTML=data.rows.map(row=>row.type==='scene'?'<li class="scene-break">'+terms[lang][row.scene]+'</li>':row.index<=revealed?dialogueMarkup(row.item,row.index):'').join('');document.getElementById('counter').textContent=(page+1)+' / '+pages.length+' '+terms[lang].page;document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===pages.length-1;document.getElementById('prev').textContent=terms[lang].prev;document.getElementById('next').textContent=terms[lang].next;const step=document.getElementById('step'),nextEntry=allEntries.findIndex((item,index)=>index>revealed);step.textContent=nextEntry<0?terms[lang].done:terms[lang].step;step.setAttribute('aria-label',nextEntry<0?terms[lang].done:terms[lang].step);step.title=nextEntry<0?terms[lang].done:terms[lang].step;step.disabled=nextEntry<0;const progress=document.getElementById('progress');progress.max=allEntries.length-1;progress.value=revealed;progress.style.setProperty('--progress',(revealed/(allEntries.length-1)*100)+'%')}
function updateInterface(){const t=terms[lang];document.documentElement.lang=lang==='th'?'th':'zh-CN';document.getElementById('brand').textContent=t.brand;document.getElementById('posLabel').textContent=t.pos;document.getElementById('meaningLabel').textContent=t.meaning;document.getElementById('usageLabel').textContent=t.usage;document.getElementById('exampleLabel').textContent=t.example;document.getElementById('pinyinLabel').textContent=t.pinyin;document.getElementById('sizeLabel').textContent=t.size;document.getElementById('close').setAttribute('aria-label',t.close);document.querySelector('[data-size=small]').textContent=t.small;document.querySelector('[data-size=medium]').textContent=t.medium;document.querySelector('[data-size=large]').textContent=t.large}
document.getElementById('lang').addEventListener('change',e=>{lang=e.target.value;updateInterface();buildPages()});document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{scale={small:1.05,medium:1.18,large:1.34}[button.dataset.size];document.documentElement.style.setProperty('--scale',scale);document.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('active',b===button));buildPages()}));document.getElementById('pinyin').addEventListener('change',e=>{document.body.classList.toggle('hide-pinyin',!e.target.checked);buildPages()});document.getElementById('prev').addEventListener('click',()=>{if(page>0){page--;revealed=pages[page].entries.at(-1)?.index??-1;openEntry=null;playBubble();renderPage()}});document.getElementById('next').addEventListener('click',()=>{if(page<pages.length-1){page++;revealed=pages[page].entries[0]?.index??-1;openEntry=null;playBubble();renderPage()}});let audioContext;function playBubble(){try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')audioContext.resume();const s=audioContext.currentTime,o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.setValueAtTime(620,s);o.frequency.exponentialRampToValueAtTime(310,s+.11);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.08,s+.014);g.gain.exponentialRampToValueAtTime(.0001,s+.16);o.connect(g);g.connect(audioContext.destination);o.start(s);o.stop(s+.17)}catch(e){}}function setProgress(index){revealed=Math.max(0,Math.min(allEntries.length-1,Number(index)));page=pages.findIndex(group=>group.entries.some(row=>row.index===revealed));if(page<0)page=0;openEntry=null;playBubble();renderPage()}function revealNext(){if(revealed>=allEntries.length-1)return;revealed++;page=pages.findIndex(group=>group.entries.some(row=>row.index===revealed));if(page<0)page=pages.length-1;playBubble();renderPage()}document.getElementById('step').addEventListener('click',revealNext);document.getElementById('progress').addEventListener('input',e=>setProgress(e.target.value));document.getElementById('dialogue').addEventListener('click',e=>{const hint=e.target.closest('.translate-hint');if(hint){const message=hint.closest('[data-entry]'),index=Number(message.dataset.entry);openEntry=openEntry===index?null:index;message.classList.toggle('open',openEntry===index);hint.setAttribute('aria-expanded',String(openEntry===index));hint.setAttribute('aria-label',openEntry===index?terms[lang].collapse:terms[lang].expand);if(openEntry===index)requestAnimationFrame(()=>message.scrollIntoView({block:'nearest',behavior:'smooth'}));return}const word=e.target.closest('[data-word]');if(word){const d=words[word.dataset.word];document.getElementById('dw').textContent=word.dataset.word;document.getElementById('dp').textContent=d[0];document.getElementById('dpos').textContent=partNames[lang][d[1]]||partNames[lang].phrase;document.getElementById('dm').textContent=d[2];document.getElementById('dt').textContent=d[3];document.getElementById('de').textContent=d[4];document.getElementById('dthai').textContent=d[5];document.getElementById('detail').classList.add('show');liftWord(word)}});document.getElementById('story').addEventListener('click',e=>{if(e.target.closest('button,[data-word]'))return;revealNext()});document.getElementById('close').addEventListener('click',()=>document.getElementById('detail').classList.remove('show'));function dismissDetailOutside(e){const detail=document.getElementById('detail');if(detail.classList.contains('show')&&!detail.contains(e.target)&&!e.target.closest('[data-word]'))detail.classList.remove('show')}document.addEventListener('pointerdown',dismissDetailOutside,true);document.addEventListener('click',dismissDetailOutside,true);let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>buildPages(),100)});function pixelAvatar(speaker){const staff=speaker==='值机员';const rows=staff?['..hhhh..','.hhhhhh.','.hssss h.'.replaceAll(' ',''),'.hs e s h.'.replaceAll(' ',''),'.hssssh.','..ssss..','..gggg..','.gggggg.','.g....g.']:['..hhhh..','.hhhhhh.','.hssss h.'.replaceAll(' ',''),'.hs e s h.'.replaceAll(' ',''),'.hssssh.','..ssss..','..bbbb..','.bbbbbb.','.b....b.'];const colors={h:'#49372e',s:'#e8b99b',e:'#342d2a',g:'#315e4c',b:'#567b91'};const cells=rows.flatMap((row,y)=>[...row].map((cell,x)=>cell==='.'?'':'<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+colors[cell]+'"/>').filter(Boolean)).join('');return '<svg class="pixel-art" viewBox="0 0 8 9" aria-hidden="true" shape-rendering="crispEdges">'+cells+'</svg>'}
function liftWord(word){document.querySelectorAll('.word.picked').forEach(w=>w.classList.remove('picked'));word.classList.add('picked');requestAnimationFrame(()=>{const sheet=document.getElementById('detail'),list=document.getElementById('dialogue'),r=word.getBoundingClientRect(),limit=innerHeight-sheet.offsetHeight-24;const top=list.getBoundingClientRect().top;if(r.bottom>limit)list.scrollTop+=r.bottom-limit;else if(r.top<top)list.scrollTop-=top-r.top})}
